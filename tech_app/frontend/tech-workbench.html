<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技术工艺智能体工作台</title>
  <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css" />
  <link rel="stylesheet" href="agent-chat.css?v=20260916-renderfix1" />
  <link rel="stylesheet" href="llm-settings-panel.css?v=llm-set3" />
  <link rel="stylesheet" href="tech-workbench.css?v=twb20" />
  <script src="cpq-sso.js?v=sso5"></script>
</head>
<body>
  <div class="tech-workbench-app tech-workbench-layout" id="techWorkbenchApp">

    <div class="tech-workbench-body">
      <!-- 56px 左侧导航：与报价单智能体同一套骨架（Logo / 新对话 / 历史 / 主页，
           底部消息 / 设置 / 账户）。会话区与右侧工作区切换不重建这里。 -->
      <nav class="tech-nav-panel" aria-label="技术工艺智能体导航">
        <a class="tech-nav-logo" href="/报价首页.html?assistant=tech" title="返回技术工艺统一主页">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="white" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="3" fill="white"/>
            <path d="M12 4V8M12 16V20M4 12H8M16 12H20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </a>
        <button type="button" class="tech-nav-icon" id="techNewChat" title="新对话（重置本次任务，图纸保留）" aria-label="新对话">
          <i class="ti ti-plus" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>新对话</b><span>重置本次技术工艺任务，图纸与文档保留</span></span>
        </button>
        <button type="button" class="tech-nav-icon" id="techHistory" title="历史记录" aria-label="历史记录">
          <i class="ti ti-history" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>历史记录</b><span>打开技术项目历史并恢复当前步骤</span></span>
        </button>
        <a class="tech-nav-icon" href="/报价首页.html?assistant=tech" title="返回技术工艺统一主页" aria-label="返回统一主页">
          <i class="ti ti-home" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>返回统一主页</b><span>技术工艺主页（与报价助手同一主页壳）</span></span>
        </a>
        <span class="tech-nav-grow" aria-hidden="true"></span>
        <button type="button" class="tech-nav-icon" id="techMsgBtn" title="消息" aria-label="消息">
          <i class="ti ti-bell" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>消息</b><span>任务流提醒（与报价助手同一消息面板）</span></span>
        </button>
        <button type="button" class="tech-nav-icon" id="techSettings" title="设置" aria-label="设置">
          <i class="ti ti-settings" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>设置</b><span>模型与参数设置</span></span>
        </button>
        <i class="tech-nav-divider" aria-hidden="true"></i>
        <button type="button" class="tech-nav-icon" id="techAuthBtn" title="登录 / 账户" aria-label="登录 / 账户">
          <i class="ti ti-login" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>登录 / 账户</b><span>登录或查看当前账户</span></span>
        </button>
      </nav>

      <!-- 中间：整个项目生命周期唯一常驻的技术工艺 Agent 会话宿主。
           切换 stage 不重建这里，草稿、历史与滚动位置都留在本列。 -->
      <section class="oc-agent-pane tech-chat-pane" id="techChatPane" aria-label="技术工艺 Agent 会话">
        <header class="tech-chat-header">
          <div class="tech-chat-title">
            <i class="ti ti-sparkles" aria-hidden="true"></i>
            技术工艺智能体
            <span class="tech-ai-badge">AI</span>
          </div>
          <div class="tech-conn-status">
            <span class="tech-conn-dot" id="techConnDot"></span>
            <span id="techConnText">连接中…</span>
          </div>
        </header>
        <div class="oc-thread" id="ocThread">
          <div class="oc-tinner" id="ocTinner">
            <div class="oc-empty" id="ocEmpty">
              <div style="font-size:30px;">✦</div>
              <div style="font-size:14px;">工艺评估助手</div>
              <div style="font-size:12.5px;">它能读取本项目图纸与技术资料、查询解析结果，并按你的要求发起解析。<br/>切换右侧步骤不会清空这里的会话。</div>
            </div>
            <!-- 任务执行进度宿主：只渲染看板桥播过来的 task-progress / task-completed /
                 task-failed，按 taskId 去重；父壳不轮询后端、不改后端任务。 -->
            <div class="oc-task-progress" id="ocTaskProgressHost" aria-live="polite" aria-label="任务执行进度"></div>
          </div>
        </div>
        <!-- 左侧统一操作栏（第 16 步）：唯一的业务动作入口，与报价 Agent 同级。
             业务按钮完全由看板动作快照动态渲染（label / role / order / hint / 可见 /
             可用都来自看板，父壳不写死动作名，也不维护兜底文案表）；主 / 次业务动作走
             TechBoardBridge.executeAction，上一步 / 下一步走 applyStage，附件上传经输入区
             圆形 ＋ 打开隐藏文件输入，失败重试重跑最近一次动作。 -->
        <nav class="tech-chat-actions" id="techChatActions" aria-label="当前步骤操作">
          <!-- 「任务文件」＝查看本项目已上传的文件（不是上传入口）。原在输入框内部，
               现归到本工具栏；上传新增走输入区左侧的圆形 +，两个入口各自复用既有逻辑。 -->
          <button type="button" class="oc-files-action" id="ocFilesAction">
            <i class="ti ti-paperclip" aria-hidden="true"></i>
            <span class="oc-files-action-label">任务文件</span>
            <span class="oc-chip-count" id="ocFilesCount" aria-live="polite">—</span>
          </button>
          <!-- 2.1 图纸解析：左侧会话栏不再重复提供任何静态能力按钮 —— 证据视图 / 导入已有
               3D 模型 / 版本与校核审查 / 联网核验 / 校验修正都归位到 2.1 页内的「更多功能 ▾」
               与看板内部视图，这里只保留下面按真实 result-summary 渲染的结果入口。
               能力本体与既有分派语义不变（Agent 仍按 capability 名分派）。 -->
          <!-- 唯一主按钮槽位：具体动作由看板快照的 role === 'primary' 决定，父壳只渲染。
               其余业务动作（含 2.1 的「一键生成全部工艺推荐」等）紧随其后动态插入。 -->
          <button type="button" id="techChatPrimary">主要操作</button>
          <!-- 2.1 结果入口：排在最后 —— 动态业务动作插在 #techChatPrimary 之后，所以这里写在
               主按钮后面才会永远落在整栏末尾。只用普通（描边）按钮样式，不再用告警黄或实心主色，
               免得和唯一主按钮抢视觉层级；只在 drawing 阶段按真实 result-summary 显示 / 启用；
               点击仍只把视图名交给唯一出口（父壳 TechBoardBridge.navigateView，独立页
               window.TechBoardViews.open），父壳不再另建一份结果条。 -->
          <button class="oc-chip" id="ocQuestionsAction" type="button" hidden>⚠ 待澄清问题<span class="oc-chip-count" id="ocQuestionsCount" aria-live="polite">0</span></button>
          <button class="oc-chip" id="ocReportAction" type="button" hidden>解析报告</button>
        </nav>
        <div class="oc-composer">
          <div class="oc-cinner">
            <!-- 单行输入区：左侧圆形 + 新增附件（在同一次用户点击链路里直接打开下面的
                 隐藏文件输入框，不弹菜单、不先导航），中间输入，右侧圆形发送。
                 模型切换不在输入框内 —— 沿用右侧头部 / 导航的「模型与参数设置」入口。
                 查看已上传文件不在输入区，改到上方工具栏的「任务文件」—— 那是两个
                 入口，不合并。 -->
            <div class="oc-inputbox oc-inputbox-single">
              <button class="oc-add" id="ocChatAttachBtn" type="button" aria-label="上传附件" title="上传附件">
                <i class="ti ti-plus" aria-hidden="true"></i>
              </button>
              <input id="ocChatFileInput" type="file" multiple hidden
                     accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.md,.csv,.json,.log,.yaml,.yml" />
              <textarea id="ocInput" rows="1" maxlength="4000"
                        placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"
                        aria-label="向工艺评估助手发送消息"></textarea>
              <button class="oc-send" id="ocSend" type="button" aria-label="发送"><i class="ti ti-send" aria-hidden="true"></i></button>
            </div>
            <!-- 会话绑定说明：原文保留，紧随输入框下方（普通文档流），与技术工艺其它会话一致。 -->
            <div class="oc-disc">会话绑定当前项目；右侧工作台只承载业务步骤，不重复会话。</div>
          </div>
        </div>
      </section>

      <!-- 右侧：唯一工作台出口，承载九步业务内容（同源受控 iframe）。
           项目 / 流程 / 模型信息与三阶段进度栏都在本列内部，不横跨左侧会话。 -->
      <section class="tech-workspace-pane">
        <header class="tech-project-header">
          <div class="tech-project-selector">
            <span class="tech-project-label">当前项目</span>
            <span class="tech-project-name" id="techProjectLabel">加载项目…</span>
          </div>
          <div class="tech-project-status">
            <span class="tech-status-dot" aria-hidden="true"></span>
            <span>技术工艺流程</span>
            <button type="button" id="techModelInfo" aria-label="修改技术工艺模型设置" title="点击修改模型设置"></button>
          </div>
        </header>
        <div class="tech-workspace-progress">
          <nav class="tech-steps-bar" id="techStepsBar" aria-label="工艺评估流程"></nav>
        </div>
        <!-- 业务结果卡（报价式圆角卡）：左上项目标题、流程条之下只包这一层卡片，
             当前步骤标题 / iframe 业务内容 / 底栏同属一张卡；右侧列容器本身不加圆角。 -->
        <section id="techResultsArea" class="tech-results-area">
        <!-- 业务卡片标题行：左侧固定大标题，右侧一行上下文小流程（大流程 3、4 渲染成
             代理页签，active 来自看板 action-state）；#techContextNotice 只放看板桥的
             未就绪 / 失败提示，不覆盖固定大标题。 -->
        <div class="tech-workspace-context" id="techContextHeader" hidden>
          <div class="tech-context-title" id="techContextTitle"></div>
          <span class="tech-context-notice" id="techContextNotice" role="status" hidden></span>
          <div class="tech-substeps-slot">
            <nav class="tech-substeps-bar" id="techSubstepsBar" aria-label="当前大流程小流程" hidden></nav>
          </div>
        </div>
        <div id="techWorkspaceOutlet" aria-live="polite">
          <div class="tech-wb-state" id="techStageState">
            <div class="tech-wb-spinner" aria-hidden="true"></div>
            <div>加载工作台…</div>
          </div>
        </div>
        <footer class="tech-workbench-bottom">
          <div class="tech-action-left" id="techActionLeft">
            <button type="button" id="techPrev" class="tech-wb-btn secondary">← 上一步</button>
            <span class="tech-wb-now" id="techNowLabel"></span>
          </div>
          <div class="tech-action-right" id="techActionRight">
            <button type="button" id="techNext" class="tech-wb-btn primary">下一步 →</button>
          </div>
        </footer>
        </section>
      </section>
    </div>
    <!-- 技术项目历史：与报价助手 #historyDrawer 同一形态的 340px 左滑抽屉 + 全屏遮罩。
         结构静态存在，父壳工作台脚本只切 .show；不动态拼第二份抽屉，也不用
         hidden + 定时器做动画。数据仍来自既有 /api/projects 与 /workflow。 -->
    <div id="techHistoryOverlay" class="overlay tech-history-mask"></div>
    <aside id="techHistoryDrawer" class="drawer tech-history-drawer" role="dialog" aria-modal="true"
           aria-labelledby="techHistoryDrawerTitle">
      <div class="drawer-header">
        <div class="drawer-title" id="techHistoryDrawerTitle">
          <i class="ti ti-history" aria-hidden="true"></i> 技术项目历史
        </div>
        <button type="button" class="icon-btn" id="techHistoryClose" aria-label="关闭历史记录">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="drawer-actions">
        <button type="button" id="techHistoryNew" class="btn-mini primary">
          <i class="ti ti-plus" aria-hidden="true"></i> 新建技术项目
        </button>
        <button type="button" class="icon-btn" id="techHistoryRefresh" aria-label="刷新历史记录" title="刷新">
          <i class="ti ti-refresh" aria-hidden="true"></i>
        </button>
      </div>
      <div class="drawer-body" id="techHistoryList">
        <div class="tech-history-empty">加载中…</div>
      </div>
    </aside>
  </div>
  <!-- 居中的模型设置卡片：报价、配置、规则、技术工艺四个入口共用同一套语义。
       固定 DOM + 全屏遮罩 + flex 居中，不再按触发按钮的 getBoundingClientRect 计算
       浮层坐标；卡片内容继续由 llm-settings-panel.js 渲染，不复制第二套表单。 -->
  <div class="tech-model-settings-mask" id="techModelSettingsMask" role="presentation" hidden>
    <div class="tech-model-settings" id="techModelSettings" role="dialog" tabindex="-1"
         aria-modal="true" aria-labelledby="techModelSettingsTitle">
      <header class="tech-model-settings-head">
        <span class="tech-model-settings-title" id="techModelSettingsTitle">模型设置</span>
        <button type="button" class="tech-model-settings-close" id="techModelSettingsClose"
                aria-label="关闭模型设置">×</button>
      </header>
      <div class="llm-set-host" id="techModelSettingsBody"></div>
    </div>
  </div>
  <script src="/cpq_auth.js"></script>
  <script src="/cpq_msg.js"></script>
  <!-- 父壳看板桥必须在 workbench 之前：底栏 / 左侧快捷操作都通过它发命令。 -->
  <script src="tech-board-bridge.js?v=tbb1"></script>
  <script src="llm-settings-panel.js?v=llm-set3"></script>
  <!-- 阶段恢复判定只有一份实现：工作台 / 首页共用，必须在 workbench 之前。 -->
  <script src="tech-stage-restore.js?v=tsr1"></script>
  <script src="tech-workbench.js?v=twb19"></script>
  <script src="tech-session-timeline.js?v=tst1"></script>
  <script src="agent-chat.js?v=20260917-modelrow1"></script>
</body>
</html>
