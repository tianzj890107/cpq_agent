<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技术工艺智能体工作台</title>
  <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css" />
  <link rel="stylesheet" href="agent-chat.css?v=20260819-layout3" />
  <link rel="stylesheet" href="llm-settings-panel.css?v=llm-set1" />
  <link rel="stylesheet" href="tech-workbench.css?v=twb8" />
  <script src="cpq-sso.js?v=sso2"></script>
</head>
<body>
  <div class="tech-workbench-app tech-workbench-layout" id="techWorkbenchApp">

    <div class="tech-workbench-body">
      <!-- 56px 左侧导航：与报价单智能体同一套骨架（Logo / 新对话 / 历史 / 主页，
           底部消息 / 设置 / 账户）。会话区与右侧工作区切换不重建这里。 -->
      <nav class="tech-nav-panel" aria-label="技术工艺智能体导航">
        <a class="tech-nav-logo" href="/报价首页.html?assistant=tech" title="返回技术工艺统一主页">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="white" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="3" fill="white"/>
            <path d="M12 4V8M12 16V20M4 12H8M16 12H20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </a>
        <button type="button" class="tech-nav-icon" id="techNewChat" title="新对话（重置本次任务，图纸保留）" aria-label="新对话">
          <i class="ti ti-plus" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>新对话</b><span>重置本次技术工艺任务，图纸与文档保留</span></span>
        </button>
        <button type="button" class="tech-nav-icon" id="techHistory" title="历史记录" aria-label="历史记录">
          <i class="ti ti-history" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>历史记录</b><span>打开技术项目历史并恢复当前步骤</span></span>
        </button>
        <a class="tech-nav-icon" href="/报价首页.html?assistant=tech" title="返回技术工艺统一主页" aria-label="返回统一主页">
          <i class="ti ti-home" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>返回统一主页</b><span>技术工艺主页（与报价助手同一主页壳）</span></span>
        </a>
        <span class="tech-nav-grow" aria-hidden="true"></span>
        <button type="button" class="tech-nav-icon" id="techMsgBtn" title="消息" aria-label="消息">
          <i class="ti ti-bell" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>消息</b><span>任务流提醒（与报价助手同一消息面板）</span></span>
        </button>
        <button type="button" class="tech-nav-icon" id="techSettings" title="设置" aria-label="设置">
          <i class="ti ti-settings" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>设置</b><span>模型与参数设置</span></span>
        </button>
        <i class="tech-nav-divider" aria-hidden="true"></i>
        <button type="button" class="tech-nav-icon" id="techAuthBtn" title="登录 / 账户" aria-label="登录 / 账户">
          <i class="ti ti-login" aria-hidden="true"></i>
          <span class="tech-nav-tip"><b>登录 / 账户</b><span>登录或查看当前账户</span></span>
        </button>
      </nav>

      <!-- 中间：整个项目生命周期唯一常驻的技术工艺 Agent 会话宿主。
           切换 stage 不重建这里，草稿、历史与滚动位置都留在本列。 -->
      <section class="oc-agent-pane tech-chat-pane" id="techChatPane" aria-label="技术工艺 Agent 会话">
        <header class="tech-chat-header">
          <div class="tech-chat-title">
            <i class="ti ti-sparkles" aria-hidden="true"></i>
            技术工艺智能体
            <span class="tech-ai-badge">AI</span>
          </div>
          <div class="tech-conn-status">
            <span class="tech-conn-dot" id="techConnDot"></span>
            <span id="techConnText">连接中…</span>
          </div>
        </header>
        <div class="oc-thread" id="ocThread">
          <div class="oc-tinner" id="ocTinner">
            <div class="oc-amsg">
              <div class="oc-abody">
                <div class="oc-intent-card">
                  <h4>技术工艺评估助手</h4>
                  <div class="oc-intent-meta">左侧会话在整个评估流程中持续存在：可以描述零件与工艺要求、追问图纸解析结果、发起解析，或直接说「开始解析」。</div>
                </div>
              </div>
            </div>
            <div class="oc-empty" id="ocEmpty">
              <div style="font-size:30px;">✦</div>
              <div style="font-size:14px;">工艺评估助手</div>
              <div style="font-size:12.5px;">它能读取本项目图纸与技术资料、查询解析结果，并按你的要求发起解析。<br/>切换右侧步骤不会清空这里的会话。</div>
            </div>
          </div>
        </div>
        <div class="oc-composer">
          <div class="oc-cinner">
            <div class="oc-inputbox">
              <textarea id="ocInput" rows="1" maxlength="4000" placeholder="向工艺评估助手描述需求…" aria-label="向工艺评估助手发送消息"></textarea>
              <button class="oc-send" id="ocSend" type="button" aria-label="发送"><i class="ti ti-send" aria-hidden="true"></i></button>
            </div>
            <div class="oc-disc">会话绑定当前项目；右侧工作台只承载业务步骤，不重复会话。</div>
          </div>
        </div>
      </section>

      <!-- 右侧：唯一工作台出口，承载九步业务内容（同源受控 iframe）。
           项目 / 流程 / 模型信息与三阶段进度栏都在本列内部，不横跨左侧会话。 -->
      <section class="tech-workspace-pane">
        <header class="tech-project-header">
          <div class="tech-project-selector">
            <span class="tech-project-label">当前项目</span>
            <span class="tech-project-name" id="techProjectLabel">加载项目…</span>
          </div>
          <div class="tech-project-status">
            <span class="tech-status-dot" aria-hidden="true"></span>
            <span>技术工艺流程</span>
            <button type="button" id="techModelInfo" aria-label="修改技术工艺模型设置" title="点击修改模型设置"></button>
          </div>
        </header>
        <div class="tech-workspace-progress">
          <nav class="tech-steps-bar" id="techStepsBar" aria-label="工艺评估流程"></nav>
        </div>
        <!-- 上下文小流程：位于业务卡片标题行内、与大流程 3、4 页面内部页签同一水平
             位置并靠右排列，只有大流程 1、5 内部还有多步时才出现；其余大流程整行隐藏，
             不会在顶部五大流程下方多出一条流程条。 -->
        <div class="tech-workspace-context" id="techContextHeader" hidden>
          <div class="tech-context-title" id="techContextTitle"></div>
          <div class="tech-substeps-slot">
            <nav class="tech-substeps-bar" id="techSubstepsBar" aria-label="当前大流程小流程" hidden></nav>
          </div>
        </div>
        <div id="techWorkspaceOutlet" aria-live="polite">
          <div class="tech-wb-state" id="techStageState">
            <div class="tech-wb-spinner" aria-hidden="true"></div>
            <div>加载工作台…</div>
          </div>
        </div>
        <footer class="tech-workbench-bottom">
          <div class="tech-action-left" id="techActionLeft">
            <button type="button" id="techPrev" class="tech-wb-btn secondary">← 上一步</button>
            <span class="tech-wb-now" id="techNowLabel"></span>
            <button type="button" id="techSecondary" class="tech-wb-btn secondary" hidden></button>
            <button type="button" id="techPrimary" class="tech-wb-btn primary" hidden></button>
          </div>
          <div class="tech-action-right" id="techActionRight">
            <button type="button" id="techNext" class="tech-wb-btn primary">下一步 →</button>
          </div>
        </footer>
      </section>
    </div>
  </div>
  <script src="/cpq_auth.js"></script>
  <script src="/cpq_msg.js"></script>
  <script src="llm-settings-panel.js?v=llm-set1"></script>
  <script src="tech-workbench.js?v=twb9"></script>
  <script src="agent-chat.js?v=20260819-match2"></script>
</body>
</html>
