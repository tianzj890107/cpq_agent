  <script>
    'use strict';

    /* ================= 配置 ================= */
    // 报价助手 Agent 服务。可用 localStorage['cpq:agentUrl'] 覆盖。
    // 默认同源 /agents/quote（cpq_suite_server.py 一体化服务）；file:// 打开时退回独立服务 47292。
    const AGENT_URL = (localStorage.getItem('cpq:agentUrl') || (location.protocol === 'file:' ? 'http://127.0.0.1:47292' : '/agents/quote')).replace(/\/$/, '');
    const STEPS = ['确认需求配置', '定价-基础成本', '定价-利润加成', '报价-其他加价项', '报价方案', '输出报价单'];
    let FORMS = []; // 固定表单目录（写死的表结构，来自 /api/meta），用于预渲染骨架

    /* ================= 状态 ================= */
    let currentStep = 1;            // Agent 实际所在步骤
    let shownStep = 1;              // 右侧面板当前展示的步骤（可点进度条查看历史步骤）
    let maxStep = 1;                // 已到达过的最大步骤（决定哪些步骤可点）
    let busy = false;               // 一轮对话进行中
    let currentSessionId = null;    // 当前会话 id（用于历史列表高亮）
    let manualMode = false;         // 「无模型」模式：不调大模型，全流程人工填写+下一步
    // section_id -> {step, kind, title, el, columns, editable}
    const sections = new Map();

    const $ = (id) => document.getElementById(id);
    const chatEl = $('chatMessages');

    /* ================= 工具函数 ================= */
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 轻量 Markdown 渲染（标题/表格/粗体/代码/列表/分隔线），输入先整体转义
    function renderMarkdown(md) {
      const lines = String(md || '').split('\n');
      const out = [];
      let inTable = false, inList = false;
      const flushTable = () => { if (inTable) { out.push('</tbody></table>'); inTable = false; } };
      const flushList = () => { if (inList) { out.push('</ul>'); inList = false; } };
      const inline = (s) => escapeHtml(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const t = line.trim();
        if (/^\|.*\|$/.test(t)) {
          const cells = t.slice(1, -1).split('|').map(c => c.trim());
          if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue; // 分隔行
          if (!inTable) {
            flushList();
            out.push('<table><thead><tr>' + cells.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>');
            inTable = true;
            // 跳过下一行的分隔行由上面的 continue 处理
          } else {
            out.push('<tr>' + cells.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>');
          }
          continue;
        }
        flushTable();
        if (/^#{1,3}\s/.test(t)) {
          flushList();
          const level = t.match(/^#+/)[0].length;
          out.push(`<h${level}>` + inline(t.replace(/^#+\s*/, '')) + `</h${level}>`);
        } else if (/^(-{3,}|\*{3,})$/.test(t)) {
          flushList();
          out.push('<hr>');
        } else if (/^[-*]\s+/.test(t)) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push('<li>' + inline(t.replace(/^[-*]\s+/, '')) + '</li>');
        } else if (t === '') {
          flushList();
        } else {
          flushList();
          out.push('<p>' + inline(line) + '</p>');
        }
      }
      flushTable(); flushList();
      return out.join('\n');
    }

    /* ================= 聊天渲染 ================= */
    function addUserBubble(text) {
      const div = document.createElement('div');
      div.className = 'message message-user';
      div.innerHTML = '<div class="message-label">我</div><div class="message-text"></div>';
      div.querySelector('.message-text').textContent = text;
      chatEl.appendChild(div);
      scrollChat();
    }

    let streamBubble = null, streamBuf = '';
    function ensureStreamBubble() {
      if (!streamBubble) {
        streamBubble = document.createElement('div');
        streamBubble.className = 'message message-ai';
        streamBubble.innerHTML = '<div class="message-label">报价单智能体</div><div class="message-text"></div>';
        chatEl.appendChild(streamBubble);
        streamBuf = '';
      }
      return streamBubble;
    }
    function appendStreamText(t) {
      const b = ensureStreamBubble();
      streamBuf += t;
      b.querySelector('.message-text').textContent = streamBuf;
      scrollChat();
    }
    function finishStreamBubble() {
      if (streamBubble && streamBuf.trim()) {
        streamBubble.querySelector('.message-text').innerHTML = renderMarkdown(streamBuf);
      } else if (streamBubble) {
        streamBubble.remove();
      }
      streamBubble = null; streamBuf = '';
      scrollChat();
    }
    function addErrorBubble(text) {
      const div = document.createElement('div');
      div.className = 'message message-ai message-error';
      div.innerHTML = '<div class="message-label">系统</div><div class="message-text"></div>';
      div.querySelector('.message-text').textContent = text;
      chatEl.appendChild(div);
      scrollChat();
    }
    function addToolActivity(main, source) {
      finishStreamBubble(); // 工具调用把当前文本气泡截断
      const div = document.createElement('div');
      div.className = 'tool-activity trace';
      const i = document.createElement('i'); i.className = 'ti ti-loader-2';
      const s = document.createElement('span'); s.textContent = main;
      div.appendChild(i); div.appendChild(s);
      if (source) {
        const sp = document.createElement('span');
        sp.className = 'src';
        sp.textContent = ' · 来源：' + source;
        div.appendChild(sp);
      }
      chatEl.appendChild(div);
      scrollChat();
      return div;
    }
    // 一次性追加一条已完成的 AI 气泡（历史回放用）
    function addAiBubble(md) {
      const div = document.createElement('div');
      div.className = 'message message-ai';
      div.innerHTML = '<div class="message-label">报价单智能体</div><div class="message-text"></div>';
      div.querySelector('.message-text').innerHTML = renderMarkdown(md);
      chatEl.appendChild(div);
      scrollChat();
    }
    // 把一次工具调用翻译成“操作轨迹 + 数据来源”文案（实时与历史回放共用）
    function describeTool(name, inp) {
      inp = inp || {};
      let main, source;
      if (name === 'cpq_ui') {
        const a = inp.action;
        const t = inp.title || inp.section_id || '';
        if (a === 'set_step') main = '进入步骤 ' + inp.step + '：' + (STEPS[(inp.step || 1) - 1] || '');
        else if (a === 'render_document') main = '生成报价单文档';
        else if (a === 'focus_section') main = '聚焦「' + t + '」，请在右侧核对';
        else if (a === 'render_form') main = '生成 / 更新「' + t + '」表单';
        else if (a === 'render_table') main = '生成 / 更新「' + t + '」表格';
        else main = '更新工作台';
        source = inp.source;
      } else if (name === 'sql_query') {
        main = '查询知识库（远程 Postgres）';
        source = String(inp.sql || '').replace(/\s+/g, ' ').trim();
        if (source.length > 180) source = source.slice(0, 177) + '…';
      } else if (name === 'Read') {
        main = '读取数据源';
        source = String(inp.file_path || '').split(/[\\/]/).pop();
      } else if (name === 'Glob' || name === 'Grep') {
        main = '检索数据…';
      } else {
        main = '调用 ' + name + '…';
      }
      return { main, source };
    }
    let typingEl = null;
    function showTyping() {
      if (typingEl) return;
      typingEl = document.createElement('div');
      typingEl.className = 'tool-activity';
      typingEl.innerHTML = '<span class="typing-dots"><i></i><i></i><i></i></span><span>思考中…</span>';
      chatEl.appendChild(typingEl);
      scrollChat();
    }
    function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }
    function scrollChat() { chatEl.scrollTop = chatEl.scrollHeight; }

    /* ================= 进度条（可点击查看/编辑历史步骤） ================= */
    function renderProgressBar() {
      const bar = $('progressBar');
      bar.innerHTML = '';
      STEPS.forEach((name, i) => {
        const n = i + 1;
        const step = document.createElement('div');
        const clickable = n <= maxStep;                 // 已到达过的步骤可点
        const viewing = (n === shownStep && shownStep !== currentStep);
        step.className = 'progress-step' + (n === currentStep ? ' active' : '') + (clickable ? ' clickable' : '');
        const state = n < currentStep ? 'completed' : (n === currentStep ? 'active' : 'pending');
        step.innerHTML =
          `<div class="step-node ${state}${viewing ? ' viewing' : ''}">` +
          (state === 'completed' ? '<i class="ti ti-check"></i>' : n) +
          `</div><span class="step-label">${escapeHtml(name)}</span>`;
        if (clickable) step.onclick = () => showStep(n);
        bar.appendChild(step);
        if (n < STEPS.length) {
          const line = document.createElement('div');
          line.className = 'progress-line' + (n < currentStep ? ' completed' : '');
          bar.appendChild(line);
        }
      });
    }

    // 预渲染某步的固定分区骨架（写死的表结构；Agent 只负责后续填值，不再实时造结构）
    function prerenderStep(n) {
      if (!FORMS.length) return;
      FORMS.filter(f => f.step === n).forEach(f => {
        if (sections.has(f.section_id)) return; // 已有（可能 Agent 已填过）
        const ui = { step: f.step, section_id: f.section_id, title: f.title, editable: f.editable };
        if (f.kind === 'form') {
          ui.action = 'render_form';
          ui.fields = (f.fields || []).map(x => ({ key: x.key, label: x.label, type: 'text', value: '' }));
          renderFormSection(ui);
        } else {
          ui.action = 'render_table';
          ui.columns = f.columns || [];
          ui.rows = [];
          renderTableSection(ui);
        }
      });
    }

    // Agent 推进到某步：更新“当前步骤”并展示它（先把该步固定骨架预渲染出来）
    function setStep(step) {
      currentStep = step;
      if (step > maxStep) maxStep = step;
      prerenderStep(step);
      showStep(step);
    }

    // 只切换右侧面板展示的步骤（不通知 Agent）；用于点进度条查看/编辑历史步骤
    function showStep(n) {
      shownStep = n;
      renderProgressBar();
      $('stepTitle').textContent = STEPS[n - 1];
      const viewingPast = (n !== currentStep);
      $('stepBadge').textContent = viewingPast ? '查看 / 编辑' : '进行中';
      sections.forEach(sec => { sec.el.style.display = (sec.step === n) ? '' : 'none'; });
      const placeholder = $('panelPlaceholder');
      if (placeholder) placeholder.style.display = 'none';
      $('resultsContent').scrollTop = 0;
      // 底部：当前步骤用「上一步/确认下一步」；查看历史步骤用「保存修改/回到当前」
      const bottomBar = $('bottomBar'), viewBar = $('viewBar');
      if (viewingPast) {
        if (bottomBar) bottomBar.style.display = 'none';
        if (viewBar) viewBar.classList.add('show');
        $('viewBarText').textContent = `正在查看第 ${n} 步「${STEPS[n - 1]}」（可编辑）—— 当前进行到第 ${currentStep} 步`;
      } else {
        if (bottomBar) bottomBar.style.display = '';
        if (viewBar) viewBar.classList.remove('show');
        $('btnPrev').disabled = busy || n <= 1;
        $('btnNext').disabled = busy;
        $('btnNextText').textContent = n >= STEPS.length ? '流程完成' : '确认，进入下一步';
      }
      // 最后一步显示「生成报价单(Word)」按钮
      const be = $('btnExport'); if (be) be.style.display = (n >= STEPS.length && !viewingPast) ? '' : 'none';
    }

    function backToCurrentStep() { showStep(currentStep); }

    // 收集各步分区数据 → 让后端生成报价单 Word 并下载
    async function exportDocx() {
      const be = $('btnExport');
      const stepsData = [];
      for (let n = 1; n <= 7; n++) {
        const secs = [];
        sections.forEach((sec) => {
          if (sec.step !== n) return;
          if (sec.kind === 'form') {
            const d = {};
            sec.el.querySelectorAll('.info-table [data-key]').forEach(el => {
              d[el.dataset.key] = ('value' in el) ? el.value : (el.dataset.value ?? el.textContent);
            });
            secs.push({ title: sec.title, kind: 'form', data: d });
          } else if (sec.kind === 'table') {
            const cols = (sec.columns || []).map(c => c.key);
            const rows = [];
            sec.el.querySelectorAll('.list-table tbody tr').forEach(tr => {
              const r = {};
              tr.querySelectorAll('[data-key]').forEach(el => {
                r[el.dataset.key] = ('value' in el && el.tagName === 'INPUT') ? el.value : (el.dataset.value ?? el.textContent);
              });
              rows.push(r);
            });
            secs.push({ title: sec.title, kind: 'table', columns: cols, data: rows });
          } else if (sec.kind === 'document') {
            secs.push({ title: sec.title, kind: 'document', markdown: sec.markdown || '' });
          }
        });
        if (secs.length) stepsData.push({ step: n, name: STEPS[n - 1], sections: secs });
      }
      if (!stepsData.length) { alert('还没有可导出的内容。'); return; }
      const payload = {
        projectName: ($('projectName') && $('projectName').textContent) || '报价单',
        customer: '', projectCode: '', steps: stepsData,
      };
      if (be) be.disabled = true;
      try {
        const resp = await fetch(AGENT_URL + '/api/export/docx', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
        });
        if (!resp.ok) { const t = await resp.json().catch(() => ({})); throw new Error(t.error || ('HTTP ' + resp.status)); }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '报价单_' + (payload.projectName || '') + '.docx';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('生成 Word 失败：' + (e.message || e));
      } finally {
        if (be) be.disabled = false;
      }
    }

    // 在“查看历史步骤”时保存用户对该步的修改，回传 Agent 重算
    function saveStepEdits() {
      if (busy) return;
      const n = shownStep;
      const data = collectStepData(n);
      const stepName = STEPS[n - 1];
      addUserBubble(`修改第 ${n} 步「${stepName}」并保存。`);
      sendToAgent(
        `【表单修改】用户在第 ${n} 步「${stepName}」修改了工作台数据(JSON)如下：\n` +
        JSON.stringify(data, null, 1) +
        `\n请以该数据为准更新该步分区（重新渲染 render_form/render_table），说明改了什么、对后续步骤的影响；` +
        `不要改变当前所在步骤（当前在第 ${currentStep} 步）。`,
        { echo: false, display: `修改第 ${n} 步并保存` }
      );
    }

    /* ================= 工作台分区渲染 ================= */
    function statusChipHtml(status) {
      if (status === 'active') return '<span class="sec-status active">待确认</span>';
      if (status === 'done') return '<span class="sec-status done">已确认</span>';
      return '';
    }

    function sectionShell(ui, kindIcon) {
      // 创建/复用 collapse-block 外壳，返回 content 容器
      let sec = sections.get(ui.section_id);
      const isNew = !sec;
      if (isNew) {
        const block = document.createElement('div');
        block.className = 'collapse-block open';
        $('resultsContent').insertBefore(block, null);
        sec = { el: block };
        sections.set(ui.section_id, sec);
      }
      sec.step = ui.step;
      sec.title = ui.title || sec.title || ui.section_id;
      // 右侧一律可编辑：用户可点击任意分区修改（含系统计算项）
      sec.editable = true;
      if (ui.status) sec.status = ui.status;
      if (ui.source) sec.source = ui.source;
      const seq = [...sections.values()].filter(s => s.step === ui.step).indexOf(sec) + 1;
      sec.el.innerHTML =
        `<div class="collapse-header" onclick="this.parentElement.classList.toggle('open')">
          <div class="collapse-title">
            <span class="num">${seq}</span>${escapeHtml(sec.title)}
            ${ui.editable === false ? '<span class="readonly-chip">系统计算·可改</span>' : ''}
            ${statusChipHtml(sec.status)}
          </div>
          <i class="ti ti-chevron-down collapse-arrow"></i>
        </div>
        <div class="collapse-content"></div>`;
      const content = sec.el.querySelector('.collapse-content');
      if (sec.source) {
        const src = document.createElement('div');
        src.className = 'sec-source';
        src.innerHTML = '<i class="ti ti-database"></i><span></span>';
        src.querySelector('span').textContent = '数据来源：' + sec.source;
        content.appendChild(src);
      }
      sec.el.style.display = (ui.step === shownStep) ? '' : 'none';
      return sec;
    }

    // 展开某分区（不再做“高光选择”，仅确保它是打开的）
    function activateSection(id) {
      const sec = sections.get(id);
      if (sec) sec.el.classList.add('open');
    }

    function setSectionStatus(id, status) {
      const sec = sections.get(id);
      if (!sec) return;
      sec.status = status;
      const title = sec.el.querySelector('.collapse-title');
      if (!title) return;
      let chip = title.querySelector('.sec-status');
      if (!status || status === 'pending') { if (chip) chip.remove(); return; }
      if (!chip) { chip = document.createElement('span'); title.appendChild(chip); }
      chip.className = 'sec-status ' + status;
      chip.textContent = status === 'done' ? '已确认' : '待确认';
    }

    function renderFormSection(ui) {
      const sec = sectionShell(ui);
      sec.kind = 'form';
      const content = sec.el.querySelector('.collapse-content');
      const table = document.createElement('table');
      table.className = 'info-table';
      const fields = ui.fields || [];
      for (let i = 0; i < fields.length; i += 2) {
        const tr = document.createElement('tr');
        for (const f of [fields[i], fields[i + 1]]) {
          if (!f) { tr.insertAdjacentHTML('beforeend', '<td class="label"></td><td class="value"></td>'); continue; }
          const label = document.createElement('td');
          label.className = 'label';
          label.innerHTML = (f.required ? '<span class="required">*</span>' : '') + escapeHtml(f.label);
          const value = document.createElement('td');
          value.className = 'value';
          value.appendChild(makeFieldInput(f, sec.editable));
          tr.appendChild(label); tr.appendChild(value);
        }
        table.appendChild(tr);
      }
      content.appendChild(table);
    }

    const GUESS_RE = /[（(](推测|推荐|推断|估计|假设|待定|待补充|默认)[)）]/;
    // 推荐值高亮：后端已把值末尾的（推荐）/（推测）文字剥掉并给 reco 标志，
    // 这里只上颜色不显示文字；GUESS_RE 作为兜底（历史数据/非固定分区值里仍带标记文字时）。
    function markGuess(el, val, reco) {
      if (reco || GUESS_RE.test(String(val || ''))) el.classList.add('guessed');
      // 用户手改过就取消高亮（不再是推荐值）
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') {
        el.addEventListener('input', () => el.classList.remove('guessed'), { once: true });
      }
    }
    function makeFieldInput(f, editable) {
      const val = f.value == null ? '' : String(f.value);
      if (!editable) {
        const span = document.createElement('span');
        span.textContent = val || '—';
        span.dataset.key = f.key;
        markGuess(span, val, f.reco);
        return span;
      }
      let el;
      if (f.type === 'select' && Array.isArray(f.options)) {
        el = document.createElement('select');
        for (const opt of f.options) {
          const o = document.createElement('option');
          o.value = o.textContent = opt;
          if (opt === val) o.selected = true;
          el.appendChild(o);
        }
        if (val && !f.options.includes(val)) {
          const o = document.createElement('option');
          o.value = o.textContent = val; o.selected = true;
          el.appendChild(o);
        }
      } else if (f.type === 'textarea') {
        el = document.createElement('textarea');
        el.value = val;
      } else {
        el = document.createElement('input');
        el.type = 'text';
        el.value = val;
      }
      el.dataset.key = f.key;
      markGuess(el, val, f.reco);
      return el;
    }

    /* ---- BOM 树形显示（参考 BOM层级结构.html：缩进 + Ln 徽标 + 展开/收起）----
       仅改变显示：五个数据列（层级/组件编码/组件名称/数量/单位）原样保留在
       [data-key] 元素里（层级为隐藏 input），collectStepData / 导出 / 回传内容不变。 */
    function bomLevelOf(v) {
      const n = parseInt(String(v == null ? '' : v).replace(/[^0-9]/g, ''), 10);
      return (n >= 1 && n <= 6) ? n : 1;
    }
    function bomToggle(btn) {
      const row = btn.closest('tr');
      const lvl = +row.dataset.level;
      let r = row.nextElementSibling;
      if (btn.classList.contains('expanded')) {
        // 收起：隐藏所有更深层级的行（含递归收起其子按钮）
        btn.classList.remove('expanded');
        while (r && +r.dataset.level > lvl) {
          r.classList.remove('visible');
          const b = r.querySelector('.exp-btn'); if (b) b.classList.remove('expanded');
          r = r.nextElementSibling;
        }
      } else {
        // 展开：只显示直接子行（level = 当前 + 1）
        btn.classList.add('expanded');
        while (r && +r.dataset.level > lvl) {
          if (+r.dataset.level === lvl + 1) r.classList.add('visible');
          r = r.nextElementSibling;
        }
      }
    }
    function isBomSection(ui) {
      return /^s2_bom_/.test(ui.section_id || '') &&
        (ui.columns || []).some(c => c.key === '层级');
    }
    function renderBomTreeSection(ui) {
      const sec = sectionShell(ui);
      sec.kind = 'table';
      sec.columns = ui.columns || [];
      const content = sec.el.querySelector('.collapse-content');
      const rows = ui.rows || [];
      const table = document.createElement('table');
      table.className = 'list-table bomtree';
      table.innerHTML = '<thead><tr><th>层级 / 组件</th><th style="width:90px">数量</th><th style="width:90px">单位</th><th style="width:56px">操作</th></tr></thead>';
      const tbody = document.createElement('tbody');
      rows.forEach((row, i) => {
        const lvl = bomLevelOf(row['层级']);
        const nextLvl = i + 1 < rows.length ? bomLevelOf(rows[i + 1]['层级']) : 0;
        tbody.appendChild(makeBomTreeRow(sec, row, lvl, nextLvl > lvl));
      });
      table.appendChild(tbody);
      content.appendChild(table);
      const toolbar = document.createElement('div');
      toolbar.className = 'list-toolbar';
      toolbar.innerHTML =
        '<a class="list-add-link" href="javascript:;"><i class="ti ti-plus"></i>新增</a>' +
        `<span class="list-footer-info">共 <span class="count">${rows.length}</span> 条</span>`;
      toolbar.querySelector('.list-add-link').onclick = () => {
        const last = tbody.rows.length ? +tbody.rows[tbody.rows.length - 1].dataset.level : 1;
        const blank = {};
        sec.columns.forEach(c => blank[c.key] = '');
        blank['层级'] = String(last);
        tbody.appendChild(makeBomTreeRow(sec, blank, last, false));
        updateRowCount(sec);
      };
      content.appendChild(toolbar);
      if (ui.footer) {
        const note = document.createElement('div');
        note.className = 'table-footer-note';
        note.textContent = ui.footer;
        content.appendChild(note);
      }
    }
    function makeBomTreeRow(sec, row, lvl, hasChild) {
      const tr = document.createElement('tr');
      tr.dataset.level = lvl;
      if (lvl > 1) tr.className = 'bom-child visible'; // 默认全部展开（显示内容不减少）
      const recoCols = Array.isArray(row._reco) ? row._reco : [];
      const td = document.createElement('td');
      const cell = document.createElement('div');
      cell.className = 'lvl-cell ind-' + Math.min(lvl, 6);
      if (hasChild) {
        const btn = document.createElement('span');
        btn.className = 'exp-btn expanded';
        btn.innerHTML = '<i class="ti ti-chevron-right"></i>';
        btn.onclick = () => bomToggle(btn);
        cell.appendChild(btn);
      } else {
        const sp = document.createElement('span');
        sp.className = 'exp-spacer';
        cell.appendChild(sp);
      }
      const badge = document.createElement('span');
      badge.className = 'lvl-badge l' + Math.min(lvl, 4);
      badge.textContent = 'L' + lvl;
      cell.appendChild(badge);
      const hid = document.createElement('input');
      hid.type = 'hidden';
      hid.dataset.key = '层级';
      hid.value = row['层级'] == null || row['层级'] === '' ? String(lvl) : String(row['层级']);
      cell.appendChild(hid);
      const code = document.createElement('input');
      code.className = 'bt-code';
      code.dataset.key = '组件编码';
      code.value = row['组件编码'] == null ? '' : String(row['组件编码']);
      markGuess(code, code.value, recoCols.includes('组件编码'));
      cell.appendChild(code);
      const name = document.createElement('input');
      name.className = 'bt-name';
      name.dataset.key = '组件名称';
      name.value = row['组件名称'] == null ? '' : String(row['组件名称']);
      markGuess(name, name.value, recoCols.includes('组件名称'));
      cell.appendChild(name);
      td.appendChild(cell);
      tr.appendChild(td);
      for (const k of ['数量', '单位']) {
        const c = document.createElement('td');
        const input = document.createElement('input');
        input.dataset.key = k;
        input.value = row[k] == null ? '' : String(row[k]);
        markGuess(input, input.value, recoCols.includes(k));
        c.appendChild(input);
        tr.appendChild(c);
      }
      const del = document.createElement('td');
      del.innerHTML = '<button class="btn-delete"><i class="ti ti-trash"></i></button>';
      del.querySelector('button').onclick = () => {
        const tbody = tr.parentElement;
        if (tbody.rows.length > 1) { tr.remove(); updateRowCount(sec); }
      };
      tr.appendChild(del);
      return tr;
    }

    function renderTableSection(ui) {
      if (isBomSection(ui)) { renderBomTreeSection(ui); return; } // BOM 分区走树形显示
      const sec = sectionShell(ui);
      sec.kind = 'table';
      sec.columns = ui.columns || [];
      const content = sec.el.querySelector('.collapse-content');
      const table = document.createElement('table');
      table.className = 'list-table';
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr>' + sec.columns.map(c => `<th>${escapeHtml(c.label)}</th>`).join('') +
        (sec.editable ? '<th>操作</th>' : '') + '</tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      for (const row of (ui.rows || [])) tbody.appendChild(makeTableRow(sec, row));
      table.appendChild(tbody);
      content.appendChild(table);

      const toolbar = document.createElement('div');
      toolbar.className = 'list-toolbar';
      toolbar.innerHTML =
        (sec.editable ? '<a class="list-add-link" href="javascript:;"><i class="ti ti-plus"></i>新增</a>' : '<span></span>') +
        `<span class="list-footer-info">共 <span class="count">${(ui.rows || []).length}</span> 条</span>`;
      if (sec.editable) {
        toolbar.querySelector('.list-add-link').onclick = () => {
          const blank = {};
          sec.columns.forEach(c => blank[c.key] = '');
          tbody.appendChild(makeTableRow(sec, blank));
          updateRowCount(sec);
        };
      }
      content.appendChild(toolbar);
      if (ui.footer) {
        const note = document.createElement('div');
        note.className = 'table-footer-note';
        note.textContent = ui.footer;
        content.appendChild(note);
      }
    }

    function makeTableRow(sec, row) {
      const tr = document.createElement('tr');
      const recoCols = Array.isArray(row._reco) ? row._reco : []; // 后端标出的推荐值列
      for (const c of sec.columns) {
        const td = document.createElement('td');
        const val = row[c.key] == null ? '' : String(row[c.key]);
        const reco = recoCols.includes(c.key);
        if (sec.editable) {
          const input = document.createElement('input');
          input.value = val;
          input.dataset.key = c.key;
          markGuess(input, val, reco);
          td.appendChild(input);
        } else {
          td.textContent = val;
          td.dataset.key = c.key;
          td.dataset.value = val;
          markGuess(td, val, reco);
        }
        tr.appendChild(td);
      }
      if (sec.editable) {
        const td = document.createElement('td');
        td.innerHTML = '<button class="btn-delete"><i class="ti ti-trash"></i></button>';
        td.querySelector('button').onclick = () => {
          const tbody = tr.parentElement;
          if (tbody.rows.length > 1) { tr.remove(); updateRowCount(sec); }
        };
        tr.appendChild(td);
      }
      return tr;
    }

    function updateRowCount(sec) {
      const tbody = sec.el.querySelector('.list-table tbody');
      const counter = sec.el.querySelector('.list-footer-info .count');
      if (tbody && counter) counter.textContent = tbody.rows.length;
    }

    function renderDocumentSection(ui) {
      const sec = sectionShell(ui);
      sec.kind = 'document';
      sec.markdown = ui.markdown || '';   // 存原文，供导出 Word
      const content = sec.el.querySelector('.collapse-content');
      const doc = document.createElement('div');
      doc.className = 'doc-body';
      doc.innerHTML = renderMarkdown(ui.markdown || '');
      content.appendChild(doc);
    }

    function applyUiEvent(ui) {
      try {
        if (ui.action === 'set_step') { setStep(ui.step); return; }
        if (ui.action === 'focus_section') {
          // 仅更新“待确认/已确认”徽标并展开该分区，不再做高光选择
          if (ui.status) setSectionStatus(ui.section_id, ui.status);
          activateSection(ui.section_id);
          return;
        }
        if (ui.action === 'render_form') renderFormSection(ui);
        else if (ui.action === 'render_table') renderTableSection(ui);
        else if (ui.action === 'render_document') renderDocumentSection(ui);
      } catch (e) {
        console.error('applyUiEvent failed', ui, e);
      }
    }

    /* ================= 表单数据采集（回传 Agent） ================= */
    function collectStepData(step) {
      const data = {};
      sections.forEach((sec, id) => {
        if (sec.step !== step) return;
        if (sec.kind === 'form') {
          const obj = {};
          sec.el.querySelectorAll('[data-key]').forEach(el => {
            obj[el.dataset.key] = ('value' in el) ? el.value : (el.dataset.value ?? el.textContent);
          });
          data[id] = { 标题: sec.title, 数据: obj };
        } else if (sec.kind === 'table') {
          const rows = [];
          sec.el.querySelectorAll('.list-table tbody tr').forEach(tr => {
            const row = {};
            tr.querySelectorAll('[data-key]').forEach(el => {
              row[el.dataset.key] = ('value' in el && el.tagName === 'INPUT') ? el.value : (el.dataset.value ?? el.textContent);
            });
            rows.push(row);
          });
          data[id] = { 标题: sec.title, 数据: rows };
        }
      });
      return data;
    }

    /* ================= 与 Agent 的通信 ================= */
    function setBusy(v) {
      busy = v;
      $('chatSend').disabled = v;
      $('btnNext').disabled = v;
      $('btnPrev').disabled = v || currentStep <= 1;
      if (!v) $('btnNext').disabled = false;
      const qfs = $('qaFillStep'), qs = $('qaStep'), qp = $('qaPrev');
      if (qfs) qfs.disabled = v;
      if (qs) qs.disabled = v;
      if (qp) qp.disabled = v || currentStep <= 1;
    }

    let turnGotContent = false; // 本轮是否收到任何文本/工具/UI 事件
    let turnHadError = false;

    async function sendToAgent(text, { echo = true, display, step } = {}) {
      if (busy) return;
      if (echo) addUserBubble(text);
      setBusy(true);
      showTyping();
      turnGotContent = false;
      turnHadError = false;
      // display 决定“历史回放里的用户气泡”：echo=true 用 text；echo=false 用传入的 display（'' 表示不记气泡）
      const body = { message: text };
      if (currentSessionId) body.sid = currentSessionId; // 会话隔离：路由到本会话专属 Bridge
      if (step) body.step = step; // 人工模式下上报本地进度（用于历史/首页卡片状态）
      if (display !== undefined) body.display = display;
      else if (!echo) body.display = '';
      try {
        const resp = await fetch(AGENT_URL + '/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
        setConn(true);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const chunk = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 2);
            if (chunk.startsWith('data:')) {
              let ev;
              try { ev = JSON.parse(chunk.slice(5)); } catch { continue; }
              handleAgentEvent(ev);
            }
          }
        }
      } catch (e) {
        turnHadError = true;
        setConn(false);
        addErrorBubble('无法连接报价助手服务（' + AGENT_URL + '）。请先运行：python cpq_agent_server.py，然后刷新页面重试。');
      } finally {
        hideTyping();
        finishStreamBubble();
        // 清理转圈图标
        chatEl.querySelectorAll('.tool-activity .ti-loader-2').forEach(i => { i.className = 'ti ti-check'; });
        // 偶发：服务连上了但本轮无任何内容（模型空回/瞬时过载）—— 给出可重试提示
        // （无模型模式下【…】记录消息本来就静默，不提示）
        if (!turnHadError && !turnGotContent && !manualMode) {
          addErrorBubble('助手本轮没有返回内容（可能是服务瞬时繁忙）。请在下方重新发送一次，或点「确认，进入下一步」重试。');
        }
        setBusy(false);
      }
    }

    function handleAgentEvent(ev) {
      if (ev.type === 'text' || ev.type === 'tool_use' || ev.type === 'ui') turnGotContent = true;
      switch (ev.type) {
        case 'text':
          hideTyping();
          appendStreamText(ev.text);
          break;
        case 'tool_use': {
          hideTyping();
          const d = describeTool(ev.name, ev.input || {});
          addToolActivity(d.main, d.source);
          showTyping();
          break;
        }
        case 'ui':
          applyUiEvent(ev.ui || {});
          break;
        case 'tool_result':
          if (ev.is_error) console.warn('tool error:', ev.content);
          break;
        case 'error':
          turnHadError = true;
          hideTyping();
          finishStreamBubble();
          addErrorBubble('出错了：' + ev.error);
          break;
        case 'done':
          if (ev.model) $('modelInfo').textContent = ' · ' + ev.model;
          break;
      }
    }

    function setConn(ok) {
      $('connDot').className = 'conn-dot ' + (ok ? 'ok' : 'err');
      $('connText').textContent = ok ? '已连接' : '未连接';
    }

    /* ================= 聊天附件上传（PDF / Word / Excel / 文本 均可解析） ================= */
    // 文本类浏览器直接读；PDF/Word/Excel 交后端 /api/extract 提取文字；其它类型只带文件名。
    let chatFiles = []; // { name, text|null, status:'parsing'|'ok'|'err', err, truncated }
    const TEXT_EXT = /\.(txt|md|csv|tsv|json|log)$/i;   // 浏览器可直接读
    const DOC_EXT = /\.(pdf|docx|xlsx)$/i;               // 交后端提取
    const MAX_EMBED = 200000;

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1] || '');
        r.onerror = () => reject(new Error('read error'));
        r.readAsDataURL(file);
      });
    }
    async function extractFileText(file) {
      if (TEXT_EXT.test(file.name)) {
        try { return { text: (await file.text()).slice(0, MAX_EMBED), err: null }; }
        catch (e) { return { text: null, err: '读取失败' }; }
      }
      if (DOC_EXT.test(file.name)) {
        try {
          const b64 = await fileToBase64(file);
          const r = await fetch(AGENT_URL + '/api/extract', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: file.name, data: b64 }),
          });
          const d = await r.json();
          if (d && d.ok) return { text: d.text, err: null, truncated: d.truncated };
          return { text: null, err: (d && d.error) || '解析失败' };
        } catch (e) { return { text: null, err: '无法连接解析服务（请确认 Agent 已启动）' }; }
      }
      return { text: null, err: '该类型暂不支持提取文字' };
    }

    function renderAttachChips() {
      const box = $('attachChips');
      box.innerHTML = '';
      chatFiles.forEach((f, i) => {
        const chip = document.createElement('span');
        chip.className = 'attach-chip';
        let icon = 'ti-paperclip';
        if (f.status === 'parsing') icon = 'ti-loader-2';
        else if (f.status === 'err') { icon = 'ti-alert-triangle'; chip.style.borderColor = 'var(--color-warning)'; }
        else if (f.status === 'ok') icon = 'ti-file-check';
        chip.innerHTML = '<i class="ti ' + icon + '"></i><span></span><i class="ti ti-x rm" title="移除"></i>';
        chip.querySelector('span').textContent = f.name;
        chip.title = f.status === 'parsing' ? (f.name + '（解析中…）')
          : f.status === 'err' ? (f.name + '（' + (f.err || '解析失败') + '）')
          : (f.name + '（已解析 ' + (f.text ? f.text.length : 0) + ' 字' + (f.truncated ? '，已截断' : '') + '）');
        chip.querySelector('.rm').onclick = () => { chatFiles.splice(i, 1); renderAttachChips(); };
        box.appendChild(chip);
      });
    }

    $('chatAttachBtn').onclick = () => $('chatFileInput').click();
    $('chatFileInput').addEventListener('change', async () => {
      const files = Array.from($('chatFileInput').files || []);
      for (const file of files) {
        const entry = { name: file.name, text: null, status: 'parsing', err: null };
        chatFiles.push(entry);
        renderAttachChips();
        const res = await extractFileText(file);
        entry.text = res.text; entry.err = res.err; entry.truncated = res.truncated;
        entry.status = res.text ? 'ok' : 'err';
        renderAttachChips();
      }
      $('chatFileInput').value = '';
    });

    function buildAttachMessage(userText) {
      if (!chatFiles.length) return userText;
      const names = chatFiles.map(f => f.name).join('、');
      let msg = (userText ? userText + '\n\n' : '') + '【上传附件】' + names + '\n';
      for (const f of chatFiles.filter(f => f.text)) {
        msg += '\n--- 文件《' + f.name + '》内容' + (f.truncated ? '（内容较长，已截断）' : '') + ' ---\n' + f.text + '\n--- 文件结束 ---\n';
      }
      const failed = chatFiles.filter(f => !f.text);
      if (failed.length) {
        msg += '\n（以下附件未能提取文字：' +
          failed.map(f => f.name + (f.err ? '（' + f.err + '）' : '')).join('、') +
          '，请据文件名与用户确认关键信息）';
      }
      return msg;
    }

    /* ================= 用户操作入口 ================= */
    function sendFromInput() {
      const input = $('chatInput');
      const text = input.value.trim();
      if ((!text && !chatFiles.length) || busy) return;
      if (chatFiles.some(f => f.status === 'parsing')) { alert('附件正在解析中，请稍候…'); return; }
      const echo = text || ('（上传附件：' + chatFiles.map(f => f.name).join('、') + '）');
      const payload = buildAttachMessage(text);
      input.value = '';
      chatFiles = [];
      renderAttachChips();
      addUserBubble(echo);          // 聊天里显示用户的话/附件说明
      sendToAgent(payload, { echo: false, display: echo }); // 实际发送可能更长（含文件内容）
    }

    $('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFromInput(); }
    });

    // 快捷动作：强行把本大步骤所有表单/表格【填满】——查不到的也用知识+推理补上，无依据的标"（推测）"
    function fillStepRecommend() {
      if (busy) return;
      if (manualMode) { addAiBubble('当前为「无模型」模式，无法自动填写。请直接在右侧人工填写各字段。'); return; }
      const n = currentStep;
      const name = STEPS[n - 1] || '';
      addUserBubble('强行填满第 ' + n + ' 步「' + name + '」的所有表单（含推测标记）。');
      sendToAgent(
        '【强行推荐】用户要求把当前第 ' + n + ' 步「' + name + '」的**所有固定分区的每一个字段/单元格都填满、绝不留空**：\n' +
        '1) 能从需求文档拿到的先填文档值；2) 文档没有的用 sql_query 查数据库补；3) 文档和库都没有的，' +
        '**用你的行业知识 + 合理推理强行推断一个值填上**（不许留空、不许写"待补充/待定/无"）。\n' +
        '**凡是靠推理/推测得到、没有文档或数据库依据的值，必须在该值末尾加"（推测）"标记**（例如「液冷（推测）」「40HQ（推测）」）。\n' +
        '用 render_form(values)/render_table(rows) 把结果全部填进右侧对应分区；' +
        '并在聊天里给出【推理过程】、并**单独列出哪些字段是无依据的推测**。不要 set_step 跳步。',
        { echo: false, display: '强行填满本步骤（含推测标记）' }
      );
    }

    function confirmStep() {
      if (busy) return;
      if (shownStep !== currentStep) showStep(currentStep); // 确认前先回到当前步骤
      const cur = currentStep;
      if (cur >= STEPS.length) {
        const done = '报价流程已完成。';
        addUserBubble(done);
        if (manualMode) {
          addAiBubble('报价流程已完成。可点「生成报价单(Word)」导出。');
          sendToAgent('【流程完成·人工模式】报价流程已人工完成。', { echo: false, display: done, step: STEPS.length });
          return;
        }
        sendToAgent('【流程完成】用户确认结束本次报价流程，请做简短总结。', { echo: false, display: done });
        return;
      }
      const data = collectStepData(cur);
      const stepName = STEPS[cur - 1];
      const next = cur + 1;
      const bubble = `确认第 ${cur} 步「${stepName}」，进入第 ${next} 步「${STEPS[next - 1]}」。`;
      addUserBubble(bubble);
      setStep(next); // ← 前端直接跳到下一步（并预渲染该步骨架），右边立刻切换，不等模型 set_step
      if (manualMode) {
        // 无模型模式：本地推进 + 静默落档（进度与数据进入历史/首页卡片，不调模型）
        sendToAgent('【人工确认】第 ' + cur + ' 步「' + stepName + '」已人工填写确认，进入第 ' + next + ' 步。数据(JSON)：\n' + JSON.stringify(data),
          { echo: false, display: bubble, step: next });
        return;
      }
      sendToAgent(
        `【表单确认】第 ${cur} 步「${stepName}」用户已确认，工作台最新数据(JSON)如下：\n` +
        JSON.stringify(data, null, 1) +
        `\n用户已进入第 ${next} 步「${STEPS[next - 1]}」。请直接开始第 ${next} 步：先【思考】要做什么、【规划】查哪张表/怎么算，` +
        `再【执行】用 sql_query 查库 + render_form(values)/render_table(rows) 把值填进第 ${next} 步的固定分区（边做边说），最后给小结。`,
        { echo: false, display: bubble }
      );
    }

    function goPrev() {
      if (busy || currentStep <= 1) return;
      const prev = currentStep - 1;
      addUserBubble('返回第 ' + prev + ' 步「' + STEPS[prev - 1] + '」。');
      setStep(prev); // 前端直接回退，右边立刻切换
      if (manualMode) {
        sendToAgent('【返回上一步·人工模式】回到第 ' + prev + ' 步。', { echo: false, display: '返回第 ' + prev + ' 步', step: prev });
        return;
      }
      sendToAgent(`【返回上一步】用户回到第 ${prev} 步「${STEPS[prev - 1]}」，等待用户查看/修改。`, { echo: false, display: '返回第 ' + prev + ' 步' });
    }

    // 开一张全新的空白报价（清掉从首页带来的旧需求，再让后端新建会话）
    async function startNewQuote() {
      if (busy) return;
      try {
        ['cpq:requirement', 'cpq:files', 'cpq:fileContents', 'cpq:projectName', 'cpq:projectCode', 'cpq:customer']
          .forEach(k => sessionStorage.removeItem(k));
      } catch {}
      // 会话隔离后无需预先重置后端：刷新页面时 init 会 /api/new 拿到全新会话
      location.reload();
    }
    // 兼容旧入口（导航「新对话」）
    function restartSession() { startNewQuote(); }

    /* ================= 历史记录 ================= */
    function closeOverlays() {
      $('overlay').classList.remove('show');
      $('historyDrawer').classList.remove('show');
      $('settingsModal').classList.remove('show');
    }
    function openHistory() {
      $('overlay').classList.add('show');
      $('historyDrawer').classList.add('show');
      loadHistoryList();
    }
    // 三个助手的历史打通：任一页面都能看到 报价/配置/规则 的全部历史并跳转打开
    function peerBase(lsKey, name, port) {
      return (localStorage.getItem(lsKey) || (location.protocol === 'file:'
        ? 'http://127.0.0.1:' + port : '/agents/' + name)).replace(/\/$/, '');
    }
    const HIST_SOURCES = [
      { agent: 'quote', label: '报价', base: AGENT_URL, self: true },
      { agent: 'config', label: '配置', base: peerBase('xbom:agentUrl', 'config', 47294), page: 'XBOM智能体-配置BOM生成.html', key: 'xbom:openSession' },
      { agent: 'rule', label: '规则', base: peerBase('cpq:ruleAgentUrl', 'rule', 47296), page: '规则助手-规则配置.html', key: 'rule:openSession' },
    ];
    async function loadHistoryList() {
      const box = $('historyList');
      box.innerHTML = '<div class="hist-empty">加载中…</div>';
      const sessions = [];
      let anyOk = false;
      await Promise.all(HIST_SOURCES.map(async src => {
        try {
          const r = await fetch(src.base + '/api/sessions').then(r => r.json());
          anyOk = true;
          (r.sessions || []).forEach(s => sessions.push(Object.assign({}, s, { _src: src })));
        } catch (e) {}
      }));
      if (!anyOk) {
        box.innerHTML = '<div class="hist-empty">无法连接助手服务，暂时读不到历史。</div>';
        return;
      }
      if (!sessions.length) {
        box.innerHTML = '<div class="hist-empty">还没有历史记录。<br>完成一次对话后会自动保存在这里。</div>';
        return;
      }
      sessions.sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
      box.innerHTML = '';
      sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = 'hist-item' + (s._src.self && s.id === currentSessionId ? ' current' : '');
        item.innerHTML =
          `<div class="h-title"></div>
           <div class="h-meta">
             <span class="h-chip"></span>
             <span></span>
           </div>
           <button class="h-del" title="删除"><i class="ti ti-trash"></i></button>`;
        item.querySelector('.h-title').textContent = s.title || '未命名会话';
        const chip = s._src.self
          ? s._src.label + '·步骤' + (s.step || 1) + '·' + (STEPS[(s.step || 1) - 1] || '')
          : s._src.label + '助手';
        item.querySelector('.h-chip').textContent = chip;
        item.querySelector('.h-meta span:last-child').textContent =
          (s.updated ? s.updated.replace('T', ' ').slice(5, 16) : '') + ' · ' + (s.turns || 0) + ' 轮';
        item.onclick = (e) => {
          if (e.target.closest('.h-del')) return;
          if (s._src.self) { openSession(s.id); return; }
          // 其他助手的会话：跳到对应页面并自动打开
          try { sessionStorage.setItem(s._src.key, s.id); } catch (err) {}
          location.href = encodeURI(s._src.page);
        };
        item.querySelector('.h-del').onclick = (e) => { e.stopPropagation(); deleteSession(s._src, s.id, s.title); };
        box.appendChild(item);
      });
    }
    async function openSession(id) {
      if (busy) { alert('请等当前回合结束再切换历史。'); return; }
      let data;
      try {
        data = await fetch(AGENT_URL + '/api/session/open', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        }).then(r => r.ok ? r.json() : null);
      } catch (e) { data = null; }
      if (!data || !data.id) { alert('无法打开该历史记录。'); return; }
      currentSessionId = data.id;
      closeOverlays();
      replaySession(data);
    }
    async function deleteSession(src, id, title) {
      if (!confirm('删除历史记录「' + (title || id) + '」？此操作不可恢复。')) return;
      try {
        await fetch((src && src.base || AGENT_URL) + '/api/session/delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
      } catch (e) {}
      loadHistoryList();
    }
    // 用历史事件流重建聊天 + 工作台
    function replaySession(data) {
      chatEl.innerHTML = '';
      sections.clear();
      $('resultsContent').innerHTML = '';
      currentStep = data.step || 1;
      renderProgressBar();
      (data.events || []).forEach(ev => {
        if (ev.type === 'user') addUserBubble(ev.text);
        else if (ev.type === 'text') addAiBubble(ev.text);
        else if (ev.type === 'tool_use') {
          const d = describeTool(ev.name, ev.input || {});
          const el = addToolActivity(d.main, d.source);
          const ic = el.querySelector('.ti-loader-2');
          if (ic) ic.className = 'ti ti-check';
        } else if (ev.type === 'ui') {
          applyUiEvent(ev.ui || {});
        }
      });
      setStep(currentStep);
      $('stepBadge').textContent = '历史记录';
      setBusy(false);
      const info = addToolActivity('已载入历史报价「' + (data.title || '') + '」，可继续对话补充或修改。');
      const ii = info.querySelector('.ti-loader-2');
      if (ii) ii.className = 'ti ti-history';
    }

    /* ================= 设置（模型 / 参数 / API Key） ================= */
    let MODELS = [];
    function openSettings() {
      $('overlay').classList.add('show');
      $('settingsModal').classList.add('show');
      $('settingsMsg').textContent = '';
      loadModels();
    }
    async function loadModels() {
      const sel = $('setModel');
      sel.innerHTML = '';
      let cur = null;
      try {
        const r = await fetch(AGENT_URL + '/api/models').then(r => r.json());
        MODELS = r.models || [];
        cur = r.current;
      } catch (e) { MODELS = []; }
      // 按 provider 分组
      const groups = {};
      MODELS.forEach(m => { (groups[m.provider_label] = groups[m.provider_label] || []).push(m); });
      Object.keys(groups).forEach(gl => {
        const og = document.createElement('optgroup');
        og.label = gl;
        groups[gl].forEach(m => {
          const o = document.createElement('option');
          o.value = m.id;
          o.textContent = m.label + (m.configured ? '' : '（未配置 Key）');
          o.dataset.provider = m.provider;
          o.dataset.providerLabel = m.provider_label;
          o.dataset.configured = m.configured ? '1' : '';
          og.appendChild(o);
        });
        sel.appendChild(og);
      });
      // 载入当前设置
      let st = {};
      try { st = await fetch(AGENT_URL + '/api/settings').then(r => r.json()); } catch (e) {}
      if (st.model) sel.value = st.model;
      else if (cur) sel.value = cur;
      const hasTemp = st.temperature !== null && st.temperature !== undefined;
      $('setTempEnable').checked = hasTemp;
      $('setTemp').value = hasTemp ? st.temperature : 0.3;
      $('tempVal').textContent = Number($('setTemp').value).toFixed(2);
      $('setTemp').disabled = !hasTemp;
      $('setMaxTokens').value = (st.max_tokens != null ? st.max_tokens : '');
      $('setThinking').checked = !!st.thinking;
      $('setThinkBudget').value = (st.thinking_budget != null ? st.thinking_budget : 8000);
      $('thinkBudgetRow').style.display = st.thinking ? '' : 'none';
      onModelChange();
    }
    function selectedModelOption() {
      const sel = $('setModel');
      return sel.options[sel.selectedIndex] || null;
    }
    function onModelChange() {
      const o = selectedModelOption();
      if (!o) return;
      const pl = o.dataset.providerLabel || '';
      const configured = o.dataset.configured === '1';
      $('apiKeyLabel').textContent = pl + ' 的 API Key（仅保存在本地 cpq_settings.json）';
      const hint = $('modelHint');
      if (configured) {
        hint.className = 'hint ok';
        hint.textContent = '提供方：' + pl + ' · 已配置 API Key，可直接使用。';
      } else {
        hint.className = 'hint warn';
        hint.textContent = '提供方：' + pl + ' · 尚未配置 API Key，请在下方填写后再保存，否则发送会失败。';
      }
    }
    function onTempEnableChange() { $('setTemp').disabled = !$('setTempEnable').checked; }
    function onThinkingChange() { $('thinkBudgetRow').style.display = $('setThinking').checked ? '' : 'none'; }
    async function saveSettings() {
      const o = selectedModelOption();
      const payload = {
        model: $('setModel').value,
        temperature: $('setTempEnable').checked ? Number($('setTemp').value) : null,
        max_tokens: $('setMaxTokens').value === '' ? null : Number($('setMaxTokens').value),
        thinking: $('setThinking').checked,
        thinking_budget: $('setThinkBudget').value === '' ? 8000 : Number($('setThinkBudget').value),
      };
      const key = $('setApiKey').value.trim();
      if (key && o) { payload.api_key = key; payload.provider = o.dataset.provider; }
      const msg = $('settingsMsg');
      msg.className = 'hint';
      msg.textContent = '保存中…';
      $('saveSettingsBtn').disabled = true;
      try {
        const r = await fetch(AGENT_URL + '/api/settings', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        }).then(r => r.json());
        $('setApiKey').value = '';
        const wasManual = manualMode;
        manualMode = (r.model || payload.model) === 'none';
        $('modelInfo').textContent = ' · ' + (manualMode ? '无模型（人工填写）' : (r.model || payload.model));
        if (manualMode !== wasManual) {
          addAiBubble(manualMode
            ? '已切换到「无模型」模式：不再调用大模型，请人工填写右侧表单并点「确认，进入下一步」。'
            : '已切换到模型 ' + (r.model || payload.model) + '：对话与自动填写功能恢复。');
        }
        if (r.configured === false) {
          msg.className = 'hint warn';
          msg.textContent = '已保存，但「' + (r.provider_label || '该提供方') + '」仍未配置可用的 API Key，发送会失败。';
        } else {
          msg.className = 'hint ok';
          msg.textContent = '已保存并生效：' + (manualMode ? '无模型（人工填写）' : (r.model || payload.model)) + '（三个助手同步生效）。';
          setTimeout(closeOverlays, 900);
        }
      } catch (e) {
        msg.className = 'hint warn';
        msg.textContent = '保存失败：' + e;
      } finally {
        $('saveSettingsBtn').disabled = false;
      }
    }
    // Esc 关闭浮层
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlays(); });

    /* ================= 启动 ================= */
    async function boot() {
      renderProgressBar();
      $('stepBadge').textContent = '等待开始';

      let requirement = '', files = [], fileContents = [];
      let projectName = '', projectCode = '', customer = '';
      try {
        requirement = sessionStorage.getItem('cpq:requirement') || '';
        files = JSON.parse(sessionStorage.getItem('cpq:files') || '[]');
        fileContents = JSON.parse(sessionStorage.getItem('cpq:fileContents') || '[]');
        projectName = sessionStorage.getItem('cpq:projectName') || '';
        projectCode = sessionStorage.getItem('cpq:projectCode') || '';
        customer = sessionStorage.getItem('cpq:customer') || '';
      } catch {}
      // 顶部「当前项目」用用户填写的项目名（不再写死波兰项目）
      if ($('projectName')) $('projectName').textContent = projectName || '未命名报价项目';

      // 探测服务 & 重置会话
      try {
        const meta = await fetch(AGENT_URL + '/api/meta').then(r => r.json());
        setConn(true);
        FORMS = meta.forms || []; // 写死的表结构（用于预渲染骨架）
        manualMode = !!(meta.settings && meta.settings.model === 'none');
        if (meta.model) $('modelInfo').textContent = ' · ' + (manualMode ? '无模型（人工填写）' : meta.model);
        const nw = await fetch(AGENT_URL + '/api/new', { method: 'POST' }).then(r => r.json()).catch(() => ({}));
        currentSessionId = nw.id || meta.session_id || null;
        try { // 记入「我的报价」（首页「我的」标签按本机创建的会话过滤）
          const mine = JSON.parse(localStorage.getItem('cpq:mySessions') || '[]');
          if (nw.id && mine.indexOf(nw.id) < 0) { mine.push(nw.id); localStorage.setItem('cpq:mySessions', JSON.stringify(mine.slice(-200))); }
        } catch (e) {}
        // 从首页「历史记录」点进来的：直接载入该会话，跳过新对话
        let openId = '';
        try { openId = sessionStorage.getItem('cpq:openSession') || ''; sessionStorage.removeItem('cpq:openSession'); } catch {}
        if (openId) { await openSession(openId); return; }
      } catch {
        setConn(false);
        $('panelPlaceholder').innerHTML =
          '<i class="ti ti-plug-x"></i><div>未连接到报价助手服务。<br>请在 配置报价CPQ 目录运行 <code>python cpq_agent_server.py</code> 后刷新本页。</div>';
        addErrorBubble('无法连接报价助手服务（' + AGENT_URL + '）。请先运行：python cpq_agent_server.py，然后刷新页面。');
        return;
      }

      const projLine = '项目名称：' + (projectName || '（未填）') + '｜项目编码：' + (projectCode || '（未填）') + '｜客户名称：' + (customer || '（未填）');
      let kickoffBubble = '';
      const bubbleParts = [];
      if (projectName || customer) bubbleParts.push('项目：' + (projectName || '-') + '（客户：' + (customer || '-') + '）');
      if (requirement) bubbleParts.push(requirement);
      if (files.length) bubbleParts.push('附件：' + files.join('、'));
      if (bubbleParts.length) { kickoffBubble = bubbleParts.join('\n'); addUserBubble(kickoffBubble); }

      // 右侧表结构写死、已预渲染出空骨架；进第 1 步即可看到 6 个固定分区
      setStep(1);
      const hasInput = requirement || fileContents.length || files.length;
      const kickoff =
        '【会话开始】用户从报价首页进入报价流程。\n' +
        projLine + '\n' +
        '（以上项目名称/编码/客户是用户在弹框里填写的权威值，请直接用于第 1 步「测算基本信息」的 客户、项目名称 等字段，不要另行臆造。）\n' +
        '需求描述：' + (requirement || '（空——用户未上传需求文档，也未填写需求描述）') + '\n' +
        '附件：' + (files.length ? files.join('、') : '无') + '\n' +
        '第 1 步的 6 个固定分区（s1_basic/s1_dest/s1_products/s1_techparams/s1_payment/s1_logistics）表结构已预渲染成【空骨架】在右侧，字段固定、你不用造结构；' +
        '但**右侧现在是空的，值必须你主动调用 cpq_ui 的 render_form(values)/render_table(rows) 填进去**——不 render 右侧就一直空着。\n' +
        (hasInput
          ? 'set_step 1，然后**逐个调用 render_form/render_table 把这 6 个固定分区都填上值**（客户/项目名称/项目编码用上面的权威值，其余从需求文档填、没有就留空），再请用户核对。' +
            '在用户点「进入下一大步骤」之前，不要 set_step 2、不要做定价/BOM/加价。'
          : '用户开了「新对话」，还没有任何需求文档/描述。**先不要往表里填值**，只在聊天里友好地请用户：① 点回形针上传需求文档，或 ② 直接输入需求描述。' +
            '等用户提供需求后，你再逐个 render_form/render_table 把值填进右侧的 6 个空骨架。不要臆造任何数据。');
      if (manualMode) {
        // 无模型模式：不发 kickoff，直接人工填写；落一条档让本单进入历史/首页卡片
        addAiBubble('当前为「无模型」模式（不调用大模型）。请直接在右侧各分区人工填写，每步完成后点「确认，进入下一步」；到第 6 步可直接生成报价单（Word）。');
        sendToAgent('【会话开始·人工模式】' + projLine, { echo: false, display: kickoffBubble || '新建报价（人工模式）', step: 1 });
        return;
      }
      let kickoffFull = kickoff;
      for (const f of fileContents) {
        if (f && f.text) {
          kickoffFull += '\n\n--- 附件《' + f.name + '》内容' + (f.truncated ? '（内容较长，已截断）' : '') + ' ---\n' + f.text + '\n--- 文件结束 ---';
        }
      }
      sendToAgent(kickoffFull, { echo: false, display: kickoffBubble });
    }

    boot();
  </script>
</body>
</html>
