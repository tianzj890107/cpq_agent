<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>确认需求解析结果 - 报价单工作流程</title>
  <link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
  <style>
    :root {
      --color-primary: #6366f1;
      --color-secondary: #8b5cf6;
      --gradient-ai: linear-gradient(135deg, #6366f1, #8b5cf6);
      --color-success: #10B981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --bg-page: #ffffff;
      --bg-secondary: #f7f7f8;
      --bg-tertiary: #ececf1;
      --border-color: #e7e7ea;
      --border-secondary: #d9d9e3;
      --text-primary: #1f2023;
      --text-secondary: #62636d;
      --text-tertiary: #9a9ba6;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', -apple-system, Inter, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
    }

    .main-container {
      display: grid;
      grid-template-columns: 56px 460px 1fr;
      height: 100vh;
      overflow: hidden;
      border: 0.5px solid var(--border-color);
    }

    /* ---------- 左侧导航 ---------- */
    .nav-panel {
      background: var(--bg-secondary);
      border-right: 0.5px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px;
      gap: 5px;
      width: 56px;
    }
    .nav-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--gradient-ai);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px; cursor: pointer;
    }
    .nav-logo svg { width: 22px; height: 22px; }
    .nav-divider { width: 32px; height: 1px; background: var(--border-color); margin: var(--space-sm) 0; }
    .nav-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s;
      color: var(--text-secondary); position: relative;
    }
    .nav-icon:hover, .nav-icon.active { background: var(--bg-tertiary); color: var(--color-primary); }
    .nav-icon .ti { font-size: 20px; }
    .nav-icon .nav-tooltip {
      position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
      margin-left: 8px; padding: 6px 10px; background: #1f2023; color: white;
      font-size: 12px; border-radius: 6px; white-space: nowrap;
      opacity: 0; visibility: hidden; transition: opacity 0.15s; pointer-events: none; z-index: 100;
    }
    .nav-icon:hover .nav-tooltip { opacity: 1; visibility: visible; }

    /* ---------- 中间对话区域 ---------- */
    .chat-panel {
      background: var(--bg-page);
      border-right: 0.5px solid var(--border-color);
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }
    .chat-header {
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--border-color);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-title {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      display: flex; align-items: center; gap: var(--space-sm);
    }
    .chat-title .ti { font-size: 20px; color: var(--color-secondary); }
    .ai-badge {
      font-size: 11px; padding: 2px 8px; border-radius: 9999px;
      background: var(--gradient-ai); color: white;
    }
    .conn-status { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; gap: 5px; }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); }
    .conn-dot.ok { background: var(--color-success); }
    .conn-dot.err { background: var(--color-danger); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .message { display: flex; flex-direction: column; max-width: 92%; }
    .message-ai {
      align-self: flex-start;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-color);
      border-radius: 14px; border-bottom-left-radius: 4px;
      padding: 11px 14px;
    }
    .message-label {
      font-size: 11px; color: var(--color-secondary); font-weight: 500;
      margin-bottom: var(--space-xs);
      display: flex; align-items: center; gap: 6px;
    }
    .message-label::before {
      content: ''; width: 6px; height: 6px;
      background: var(--gradient-ai); border-radius: 50%; flex-shrink: 0;
    }
    .message-text { font-size: 14px; color: var(--text-primary); line-height: 1.7; word-break: break-word; }
    .message-text p { margin: 4px 0; }
    .message-text ul, .message-text ol { margin: 4px 0 4px 20px; }
    .message-text code {
      background: var(--bg-tertiary); border-radius: 4px;
      padding: 1px 5px; font-size: 12.5px;
      font-family: Consolas, Menlo, monospace;
    }
    .message-user {
      align-self: flex-end;
      background: var(--gradient-ai); color: white;
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px;
    }
    .message-user .message-label { color: rgba(255,255,255,0.85); flex-direction: row-reverse; }
    .message-user .message-label::before { background: rgba(255,255,255,0.7); }
    .message-user .message-text { color: white; white-space: pre-wrap; }
    .message-error .message-text { color: var(--color-danger); }

    .tool-activity {
      align-self: flex-start;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-tertiary);
      padding: 2px 6px;
    }
    .tool-activity .ti { font-size: 14px; }

    .typing-dots { display: inline-flex; gap: 3px; align-items: center; }
    .typing-dots i {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--text-tertiary); display: inline-block;
      animation: blink 1.2s infinite;
    }
    .typing-dots i:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }

    .chat-input-area { padding: 10px 16px; border-top: 0.5px solid var(--border-color); flex-shrink: 0; }
    .chat-input-wrapper { display: flex; gap: var(--space-sm); align-items: center; }
    .chat-input {
      flex: 1; padding: 9px 10px;
      border: 0.5px solid var(--border-secondary);
      border-radius: 11px; background: var(--bg-secondary);
      font-size: 14px; font-family: inherit; resize: none; outline: none;
    }
    .chat-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12); }
    .chat-send {
      width: 38px; height: 38px; border: none; border-radius: 11px;
      background: var(--gradient-ai); color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .chat-send:disabled { opacity: 0.45; cursor: not-allowed; }
    .chat-send .ti { font-size: 18px; color: white; }

    /* ---------- 右侧区域 ---------- */
    .right-panel { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg-page); }
    .project-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 16px; background: var(--bg-page);
      border-bottom: 0.5px solid var(--border-color); flex-shrink: 0;
    }
    .project-selector { display: flex; align-items: center; gap: 8px; }
    .project-label { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
    .project-name { font-size: 14px; font-weight: 500; }
    .project-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-tertiary); }
    .status-dot { width: 8px; height: 8px; background: var(--color-success); border-radius: 50%; }

    .progress-bar {
      display: flex; align-items: center;
      background: var(--bg-page); padding: 14px 16px;
      border-bottom: 0.5px solid var(--border-color);
      flex-shrink: 0; overflow-x: auto;
    }
    .progress-step { display: flex; align-items: center; flex-shrink: 0; cursor: default; }
    .progress-step.clickable { cursor: pointer; }
    .progress-step.clickable:hover .step-node { transform: scale(1.08); }
    .progress-step.clickable:hover .step-label { color: var(--color-primary); }
    .step-node {
      width: 30px; height: 30px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 13px; flex-shrink: 0; transition: transform 0.15s;
    }
    .step-node.completed { background: var(--color-primary); color: white; }
    .step-node.active { background: var(--gradient-ai); color: white; box-shadow: 0 0 0 4px rgba(99,102,241,0.15); }
    .step-node.pending { background: var(--bg-tertiary); color: var(--text-tertiary); border: 0.5px solid var(--border-color); }
    /* 正在查看（非当前步骤）的节点：描边提示 */
    .step-node.viewing { box-shadow: 0 0 0 3px rgba(139,92,246,0.35); }
    .step-node .ti { font-size: 15px; }
    .step-label { margin-left: 6px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
    .progress-step.active .step-label { color: var(--color-primary); font-weight: 600; }

    /* 聊天快捷动作条 */
    .quick-actions {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 8px;
    }
    .quick-action-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 11px; border-radius: 9999px; font-size: 12.5px; font-weight: 500; cursor: pointer;
      border: 0.5px solid var(--border-secondary); background: var(--bg-page); color: var(--text-primary);
      transition: all 0.15s;
    }
    .quick-action-btn:hover:not(:disabled) { border-color: var(--color-primary); color: var(--color-primary); background: var(--bg-secondary); }
    .quick-action-btn.primary { background: var(--gradient-ai); color: white; border: none; }
    .quick-action-btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
    .quick-action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .quick-action-btn .ti { font-size: 14px; }
    /* Agent 动态建议动作（气泡内） */
    .msg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    /* 查看历史步骤时的提示条 */
    .view-bar {
      display: none; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 16px; background: rgba(139,92,246,0.07);
      border-top: 0.5px solid var(--border-color); flex-shrink: 0; font-size: 12.5px;
    }
    .view-bar.show { display: flex; }
    .view-bar .vb-text { color: var(--color-secondary); display: flex; align-items: center; gap: 6px; }
    .view-bar .vb-actions { display: flex; gap: 8px; }
    .progress-line { width: 14px; height: 2px; background: var(--border-color); margin: 0 4px; flex-shrink: 0; }
    .progress-line.completed { background: var(--color-primary); }

    .results-area {
      background: var(--bg-page);
      border: 0.5px solid var(--border-color);
      display: flex; flex-direction: column;
      flex: 1; overflow: hidden;
      margin: var(--space-lg);
      border-radius: var(--radius-lg);
    }
    .results-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 0.5px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .results-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: var(--space-sm); }
    .section-badge { font-size: 11px; padding: 3px 10px; border-radius: 9999px; font-weight: 500; }
    .badge-active { background: rgba(99, 102, 241, 0.12); color: var(--color-primary); }
    .results-content { padding: var(--space-lg); flex: 1; overflow-y: auto; }

    .panel-placeholder {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-tertiary); padding: 60px 20px; text-align: center;
    }
    .panel-placeholder .ti { font-size: 34px; color: var(--border-secondary); }

    /* 可折叠区块 */
    .collapse-block {
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
    }
    .collapse-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; cursor: pointer; user-select: none;
    }
    .collapse-header:hover { background: var(--bg-tertiary); }
    .collapse-title {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      display: flex; align-items: center; gap: var(--space-sm);
    }
    .collapse-title .num {
      min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px;
      background: var(--gradient-ai); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
    }
    .readonly-chip {
      font-size: 10px; color: var(--text-tertiary);
      border: 0.5px solid var(--border-secondary); border-radius: 9999px;
      padding: 1px 7px; font-weight: 400;
    }
    .collapse-arrow { font-size: 16px; color: var(--text-tertiary); transition: transform 0.2s; }
    .collapse-block.open .collapse-arrow { transform: rotate(180deg); }
    .collapse-content {
      display: none; padding: 8px 14px 12px 14px;
      border-top: 0.5px solid var(--border-color); background: white;
      overflow-x: auto;
    }
    .collapse-block.open .collapse-content { display: block; }

    /* 子步骤状态徽标 */
    .sec-status {
      font-size: 10px; font-weight: 600; padding: 1px 8px; border-radius: 9999px; margin-left: 2px;
    }
    .sec-status.active { background: rgba(99,102,241,0.14); color: var(--color-primary); }
    .sec-status.done { background: rgba(16,185,129,0.14); color: var(--color-success); }
    /* 无依据的推测值：琥珀色高亮，让用户一眼看出哪些是猜的 */
    .info-table input.guessed, .list-table input.guessed, .info-table span.guessed, .list-table td.guessed {
      background: #FEF3C7; border-color: var(--color-warning); color: #92400e; font-weight: 500;
    }
    .sec-source {
      font-size: 11px; color: var(--text-tertiary); margin: 2px 0 8px;
      display: flex; align-items: center; gap: 5px;
    }
    .sec-source .ti { font-size: 13px; color: var(--color-secondary); }

    /* 数据来源 / 操作轨迹（比原「更新工作台」更具体） */
    .tool-activity.trace { color: var(--text-secondary); background: var(--bg-secondary);
      border: 0.5px solid var(--border-color); border-radius: 8px; padding: 5px 9px; gap: 7px; }
    .tool-activity.trace .ti { color: var(--color-secondary); }
    .tool-activity.trace .ti-check { color: var(--color-success); }
    .tool-activity.trace .src { color: var(--text-tertiary); }

    /* 聊天附件 */
    .attach-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .attach-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--bg-secondary); border: 0.5px solid var(--border-secondary);
      border-radius: 9999px; padding: 3px 8px; font-size: 12px; color: var(--text-secondary);
    }
    .attach-chip .ti { font-size: 13px; color: var(--color-secondary); }
    .attach-chip .rm { cursor: pointer; color: var(--text-tertiary); font-size: 13px; }
    .attach-chip .rm:hover { color: var(--color-danger); }
    .chat-attach-btn {
      width: 38px; height: 38px; border: 0.5px solid var(--border-secondary); border-radius: 11px;
      background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .chat-attach-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .chat-attach-btn .ti { font-size: 18px; }

    /* 键值表单 */
    .info-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .info-table tr { border-bottom: 1px solid var(--border-color); }
    .info-table tr:last-child { border-bottom: none; }
    .info-table .label {
      width: 150px; padding: var(--space-sm) var(--space-md);
      color: var(--text-secondary); font-weight: 500;
      vertical-align: top; white-space: nowrap;
    }
    .info-table .label .required { color: #ef4444; margin-right: 2px; }
    .info-table .value { padding: var(--space-sm) var(--space-md); color: var(--text-primary); }
    .info-table input, .info-table select, .info-table textarea {
      width: 100%; border: 1px solid var(--border-color); border-radius: 6px;
      padding: 6px 10px; font-size: 13px; font-family: inherit;
      color: var(--text-primary); background: white; outline: none;
    }
    .info-table input:focus, .info-table select:focus, .info-table textarea:focus {
      border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }
    .info-table textarea { resize: vertical; min-height: 48px; }

    /* 列表表格 */
    .list-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 0.5px solid var(--border-color); }
    .list-table thead { background: var(--bg-secondary); }
    .list-table th {
      padding: 8px 10px; text-align: left; font-weight: 600;
      color: var(--text-secondary); border-bottom: 0.5px solid var(--border-color);
      white-space: nowrap; font-size: 12px;
    }
    .list-table td { padding: 6px 10px; border-bottom: 0.5px solid var(--border-color); vertical-align: middle; white-space: nowrap; }
    .list-table tbody tr:last-child td { border-bottom: none; }
    .list-table tbody tr:hover { background: var(--bg-secondary); }
    .list-table input {
      min-width: 70px; width: 100%;
      border: 1px solid var(--border-color); border-radius: 4px;
      padding: 4px 6px; font-size: 13px; font-family: inherit;
      color: var(--text-primary); background: white; outline: none;
    }
    .list-table input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1); }
    /* BOM 树形显示（参考 BOM层级结构.html）：缩进 + Ln 徽标 + 展开/收起。仅改显示，数据列原样保留 */
    .bomtree .lvl-cell { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .bomtree .exp-btn { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #9ca3af; transition: transform .2s; flex-shrink: 0; }
    .bomtree .exp-btn:hover { color: var(--color-primary); }
    .bomtree .exp-btn.expanded { transform: rotate(90deg); }
    .bomtree .exp-btn .ti { font-size: 12px; }
    .bomtree .exp-spacer { width: 18px; flex-shrink: 0; }
    .bomtree .lvl-badge { font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 3px; flex-shrink: 0; }
    .bomtree .lvl-badge.l1 { background: #eef2ff; color: #6366f1; }
    .bomtree .lvl-badge.l2 { background: rgba(99, 102, 241, 0.1); color: #6366f1; }
    .bomtree .lvl-badge.l3 { background: #f3f4f6; color: #62636d; }
    .bomtree .lvl-badge.l4 { background: #f9fafb; color: #9ca3af; }
    .bomtree tr.bom-child { display: none; }
    .bomtree tr.bom-child.visible { display: table-row; }
    .bomtree .ind-1 { padding-left: 0; } .bomtree .ind-2 { padding-left: 28px; }
    .bomtree .ind-3 { padding-left: 56px; } .bomtree .ind-4 { padding-left: 84px; }
    .bomtree .ind-5 { padding-left: 112px; } .bomtree .ind-6 { padding-left: 140px; }
    .bomtree .lvl-cell input.bt-code { width: 150px; min-width: 0; flex-shrink: 0; }
    .bomtree .lvl-cell input.bt-name { width: auto; flex: 1; min-width: 110px; }
    .btn-delete {
      padding: 4px 6px; background: transparent; color: var(--text-tertiary);
      border: none; border-radius: 4px; cursor: pointer; transition: all 0.15s;
    }
    .btn-delete:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .btn-delete .ti { font-size: 14px; }
    .list-toolbar { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .list-add-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--color-primary); font-size: 13px; cursor: pointer; text-decoration: none;
    }
    .list-add-link:hover { color: var(--color-secondary); }
    .list-add-link .ti { font-size: 14px; }
    .list-footer-info { font-size: 12px; color: var(--text-tertiary); }
    .list-footer-info .count { color: var(--text-secondary); font-weight: 500; }
    .table-footer-note { margin-top: 8px; font-size: 12px; color: var(--text-tertiary); }

    /* 文档（报价单） */
    .doc-body { font-size: 13.5px; line-height: 1.8; color: var(--text-primary); padding: 4px 2px; }
    .doc-body h1 { font-size: 19px; margin: 10px 0; text-align: center; }
    .doc-body h2 { font-size: 15px; margin: 14px 0 6px; border-left: 3px solid var(--color-primary); padding-left: 8px; }
    .doc-body h3 { font-size: 14px; margin: 10px 0 4px; }
    .doc-body p { margin: 4px 0; }
    .doc-body hr { border: none; border-top: 1px solid var(--border-color); margin: 10px 0; }
    .doc-body table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 8px 0; }
    .doc-body th, .doc-body td { border: 0.5px solid var(--border-secondary); padding: 6px 8px; text-align: left; }
    .doc-body th { background: var(--bg-secondary); font-weight: 600; }
    .doc-body ul, .doc-body ol { margin: 4px 0 4px 22px; }

    /* 底部导航 */
    .bottom-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px;
      border-top: 0.5px solid var(--border-color); flex-shrink: 0;
    }
    .bottom-bar .btn {
      padding: 9px 20px; font-size: 14px; font-weight: 500;
      border-radius: 10px; min-width: 110px; justify-content: center;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .bottom-bar .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary { background: var(--bg-page); color: var(--text-primary); border: 0.5px solid var(--border-secondary); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-secondary); border-color: var(--color-primary); }
    .btn-primary {
      background: var(--gradient-ai); color: white; border: none;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
    .bottom-bar .btn .ti { font-size: 16px; }

    @media (max-width: 1024px) { .main-container { grid-template-columns: 56px 340px 1fr; } }

    /* ---------- 历史抽屉 / 设置弹窗 ---------- */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,16,25,0.35);
      opacity: 0; visibility: hidden; transition: opacity 0.18s; z-index: 900;
    }
    .overlay.show { opacity: 1; visibility: visible; }

    .drawer {
      position: fixed; top: 0; left: 0; height: 100vh; width: 340px;
      background: var(--bg-page); border-right: 0.5px solid var(--border-color);
      box-shadow: 4px 0 24px rgba(15,16,25,0.12);
      transform: translateX(-104%); transition: transform 0.22s ease; z-index: 950;
      display: flex; flex-direction: column;
    }
    .drawer.show { transform: translateX(0); }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 0.5px solid var(--border-color); flex-shrink: 0;
    }
    .drawer-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .drawer-title .ti { font-size: 18px; color: var(--color-secondary); }
    .icon-btn {
      width: 30px; height: 30px; border: none; background: transparent; cursor: pointer;
      border-radius: 8px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--bg-secondary); color: var(--color-primary); }
    .icon-btn .ti { font-size: 17px; }
    .drawer-actions {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-bottom: 0.5px solid var(--border-color); flex-shrink: 0;
    }
    .btn-mini {
      display: inline-flex; align-items: center; gap: 5px; flex: 1; justify-content: center;
      padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 500; cursor: pointer;
      border: 0.5px solid var(--border-secondary); background: var(--bg-page); color: var(--text-primary);
    }
    .btn-mini.primary { background: var(--gradient-ai); color: white; border: none; }
    .btn-mini .ti { font-size: 15px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 10px 12px; }

    .hist-item {
      border: 0.5px solid var(--border-color); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px; cursor: pointer; background: var(--bg-page);
      transition: border-color 0.15s, box-shadow 0.15s; position: relative;
    }
    .hist-item:hover { border-color: var(--color-primary); box-shadow: 0 2px 10px rgba(99,102,241,0.12); }
    .hist-item.current { border-color: var(--color-primary); background: rgba(99,102,241,0.05); }
    .hist-item .h-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 22px; }
    .hist-item .h-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 4px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hist-item .h-chip { background: var(--bg-tertiary); border-radius: 9999px; padding: 1px 7px; color: var(--text-secondary); }
    .hist-item .h-del {
      position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border: none;
      background: transparent; color: var(--text-tertiary); cursor: pointer; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .hist-item .h-del:hover { background: rgba(239,68,68,0.1); color: var(--color-danger); }
    .hist-item .h-del .ti { font-size: 14px; }
    .hist-empty { text-align: center; color: var(--text-tertiary); padding: 40px 16px; font-size: 13px; }

    .modal {
      position: fixed; inset: 0; z-index: 960; display: none; align-items: center; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-card {
      position: relative; width: 460px; max-width: calc(100vw - 32px); max-height: calc(100vh - 64px);
      background: var(--bg-page); border-radius: 16px; box-shadow: 0 20px 60px rgba(15,16,25,0.28);
      display: flex; flex-direction: column; z-index: 1;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; border-bottom: 0.5px solid var(--border-color);
    }
    .modal-body { padding: 16px 18px; overflow-y: auto; }
    .modal-body label { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-secondary);
      margin: 14px 0 6px; }
    .modal-body label:first-child { margin-top: 0; }
    .modal-body select, .modal-body input[type="text"], .modal-body input[type="password"],
    .modal-body input[type="number"] {
      width: 100%; border: 1px solid var(--border-secondary); border-radius: 8px;

    .modal-body .hint { font-size: 11.5px; color: var(--text-tertiary); margin-top: 6px; line-height: 1.5; }
    .modal-body .hint.warn { color: var(--color-warning); }

    .field-row { display: flex; align-items: center; gap: 10px; }

</head>
<body>

          <div class="vb-actions">

  <!-- 遮罩 + 历史抽屉 + 设置弹窗 -->

  <div class="modal" id="settingsModal" onclick="if(event.target===this)closeOverlays()">
    <div class="modal-card">
      <div class="modal-header">

          <span id="tempVal" style="font-size:12px;color:var(--text-secondary);min-width:30px;text-align:right">0.30</span>
