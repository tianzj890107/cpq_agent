<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>硕磐智能中心</title>
  <link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
  <!-- 离线部署：Inter 网络字体已移除，回退系统字体 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'PingFang SC', -apple-system, sans-serif;
      min-height: 100vh;
      position: relative;
    }

    /* 渐变背景 */
    .gradient-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 25%, #8b5cf6 50%, #a78bfa 75%, #60a5fa 100%);
      z-index: 0;
    }

    /* 光晕效果 */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: pulse 8s infinite ease-in-out;
    }

    .glow-orb-1 {
      width: 300px;
      height: 300px;
      background: rgba(99, 102, 241, 0.6);
      top: -50px;
      right: 20%;
      animation-delay: 0s;
    }

    .glow-orb-2 {
      width: 250px;
      height: 250px;
      background: rgba(139, 92, 246, 0.6);
      bottom: -30px;
      left: 10%;
      animation-delay: -4s;
    }

    .glow-orb-3 {
      width: 200px;
      height: 200px;
      background: rgba(167, 139, 250, 0.5);
      top: 40%;
      left: 30%;
      animation-delay: -2s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    /* 动态粒子效果 */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: float 20s infinite ease-in-out;
    }

    .particle:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
    .particle:nth-child(2) { width: 120px; height: 120px; top: 60%; left: 5%; animation-delay: -3s; }
    .particle:nth-child(3) { width: 60px; height: 60px; top: 30%; left: 40%; animation-delay: -6s; }
    .particle:nth-child(4) { width: 100px; height: 100px; top: 70%; left: 30%; animation-delay: -9s; }
    .particle:nth-child(5) { width: 50px; height: 50px; top: 20%; left: 70%; animation-delay: -12s; }
    .particle:nth-child(6) { width: 90px; height: 90px; top: 50%; left: 60%; animation-delay: -15s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(20px, -30px) rotate(90deg); }
      50% { transform: translate(-10px, 20px) rotate(180deg); }
      75% { transform: translate(30px, 10px) rotate(270deg); }
    }

    /* 网格线装饰 */
    .grid-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
    }

    /* 主体容器：无登录区，功能内容全宽平铺、水平垂直居中 */
    .main-container {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 2;
      justify-content: center;
      align-items: center;
    }

    /* 功能区域（全宽居中） */
    .feature-section {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      color: white;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 50px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 33%, #8b5cf6 66%, #a78bfa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
    }

    .logo-icon i {
      font-size: 28px;
      color: white;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      color: white;
    }

    .feature-title {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .feature-desc {
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* 功能卡片：平铺成网格 */
    .功能-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
    }

    .功能卡片 {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .功能卡片:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
    }

    .功能图标 {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .功能图标.purple {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .功能图标.blue {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .功能图标 i {
      font-size: 26px;
      color: white;
    }

    .功能信息 {
      flex: 1;
    }

    .功能标题 {
      font-size: 17px;
      font-weight: 600;
      color: white;
      margin-bottom: 4px;
    }

    .功能描述 {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    .功能箭头 {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.2s;
    }

    .功能卡片:hover .功能箭头 {
      color: white;
      transform: translateX(4px);
    }

    .page-footer {
      margin-top: 56px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .feature-section {
        padding: 40px 24px;
      }

      .feature-title {
        font-size: 26px;
      }

      .功能-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- 渐变背景 -->
  <div class="gradient-bg"></div>

  <!-- 光晕效果 -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>
  <div class="glow-orb glow-orb-3"></div>

  <!-- 动态粒子 -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- 网格线 -->
  <div class="grid-lines"></div>

  <!-- 主体容器（已去掉登录区，功能内容全宽平铺） -->
  <div class="main-container">
    <div class="feature-section">
      <div class="brand-logo">
        <div class="logo-icon">
          <i class="ti ti-sparkles"></i>
        </div>
        <span class="logo-text">硕磐智能中心</span>
      </div>

      <h1 class="feature-title">让智能配置<br>更简单高效</h1>
      <p class="feature-desc">一站式产品配置管理平台，选择下方功能开始工作</p>

      <div class="功能-list">
        <!-- Agent 智能体：进入三个智能体整合首页（报价/配置/规则） -->
        <div class="功能卡片" onclick="location.href=encodeURI('报价首页(1).html')">
          <div class="功能图标 purple">
            <i class="ti ti-robot"></i>
          </div>
          <div class="功能信息">
            <div class="功能标题">Agent 智能体</div>
            <div class="功能描述">配置助手 · 报价助手 · 规则助手</div>
          </div>
          <i class="ti ti-chevron-right 功能箭头"></i>
        </div>

        <!-- 数据可视化 -->
        <div class="功能卡片" onclick="alert('数据可视化功能开发中')">
          <div class="功能图标 blue">
            <i class="ti ti-chart-bar"></i>
          </div>
          <div class="功能信息">
            <div class="功能标题">数据可视化</div>
            <div class="功能描述">配置数据统计与分析</div>
          </div>
          <i class="ti ti-chevron-right 功能箭头"></i>
        </div>
      </div>

      <div class="page-footer">© 2024 硕磐智能中心</div>
    </div>
  </div>
</body>
</html>
